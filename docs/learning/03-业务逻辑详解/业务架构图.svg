<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="1290" viewBox="0 0 1120 1290" role="img" aria-labelledby="title desc"><title id="title">有据售后 · 业务架构总览</title><desc id="desc">从客户诉求到业务结果 看清角色 规则 主线与实现边界</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L7 4L0 8" fill="#52758a"/></marker><style>text{font-family:'Microsoft YaHei','Noto Sans SC',sans-serif;fill:#253b49}.title{font-size:25px;font-weight:700}.subtitle{font-size:16px;fill:#607581}.head{font-size:19px;font-weight:700}.body{font-size:16px}.label{font-size:14px;fill:#405e70}.group{font-size:16px;font-weight:700;fill:#4c6b7d}</style></defs><rect width="1120" height="1290" fill="#f8fafb" rx="16"/>
<text x="560" y="43" text-anchor="middle" class="title"><tspan x="560" dy="0">有据售后 · 业务架构总览</tspan></text>
<text x="560" y="74" text-anchor="middle" class="subtitle"><tspan x="560" dy="0">从客户诉求到业务结果 看清角色 规则 主线与实现边界</tspan></text>
<rect x="25" y="105" width="1070" height="155" rx="14" fill="#f0f4f7" stroke="#cfdae1"/>
<text x="560" y="132" text-anchor="middle" class="group"><tspan x="560" dy="0">01 参与角色与业务入口 · B01 / B10</tspan></text>
<rect x="25" y="310" width="1070" height="155" rx="14" fill="#f0f4f7" stroke="#cfdae1"/>
<text x="560" y="337" text-anchor="middle" class="group"><tspan x="560" dy="0">02 可信事实与方案判定 · B02 / B03</tspan></text>
<rect x="25" y="515" width="1070" height="155" rx="14" fill="#f0f4f7" stroke="#cfdae1"/>
<text x="560" y="542" text-anchor="middle" class="group"><tspan x="560" dy="0">03 已接入的业务主线 · B04 / B05 / B06</tspan></text>
<rect x="25" y="720" width="1070" height="155" rx="14" fill="#f0f4f7" stroke="#cfdae1"/>
<text x="560" y="747" text-anchor="middle" class="group"><tspan x="560" dy="0">04 原业务执行与资金确认 · B04 / B05</tspan></text>
<rect x="25" y="925" width="1070" height="155" rx="14" fill="#f0f4f7" stroke="#cfdae1"/>
<text x="560" y="952" text-anchor="middle" class="group"><tspan x="560" dy="0">05 客户反馈与人工收口 · B07 / B09 / B10</tspan></text>
<path d="M560 260V310" fill="none" stroke="#52758a" stroke-width="1.8"  marker-end="url(#arrow)"/>
<rect x="636" y="274" width="168" height="23" rx="4" fill="#f8fafb"/>
<text x="720" y="290" text-anchor="middle" class="label"><tspan x="720" dy="0">输入需经身份与事实校验</tspan></text>
<path d="M560 465V515" fill="none" stroke="#52758a" stroke-width="1.8"  marker-end="url(#arrow)"/>
<rect x="634.25" y="479" width="161.5" height="23" rx="4" fill="#f8fafb"/>
<text x="715" y="495" text-anchor="middle" class="label"><tspan x="715" dy="0">按资格 类型与授权分流</tspan></text>
<path d="M560 670V720" fill="none" stroke="#52758a" stroke-width="1.8"  marker-end="url(#arrow)"/>
<rect x="637" y="684" width="196" height="23" rx="4" fill="#f8fafb"/>
<text x="735" y="700" text-anchor="middle" class="label"><tspan x="735" dy="0">仅满足前置条件的原业务继续</tspan></text>
<path d="M560 875V925" fill="none" stroke="#52758a" stroke-width="1.8"  marker-end="url(#arrow)"/>
<rect x="639" y="889" width="182" height="23" rx="4" fill="#f8fafb"/>
<text x="730" y="905" text-anchor="middle" class="label"><tspan x="730" dy="0">依据持久事实反馈当前结果</tspan></text>
<rect x="55" y="145" width="310" height="100" rx="10" fill="#e8eff5" stroke="#b8cbd7"/>
<text x="210" y="177" text-anchor="middle" class="head"><tspan x="210" dy="0">客户与 Agent</tspan></text>
<text x="210" y="207" text-anchor="middle" class="body"><tspan x="210" dy="0">表达诉求 查询补问</tspan><tspan x="210" dy="23">确认订单与商品 提出申请</tspan></text>
<rect x="405" y="145" width="310" height="100" rx="10" fill="#e8eff5" stroke="#b8cbd7"/>
<text x="560" y="177" text-anchor="middle" class="head"><tspan x="560" dy="0">操作员</tspan></text>
<text x="560" y="207" text-anchor="middle" class="body"><tspan x="560" dy="0">接管沟通 运营寄回登记</tspan><tspan x="560" dy="23">确认收货 申请人工结案</tspan></text>
<rect x="755" y="145" width="310" height="100" rx="10" fill="#e8eff5" stroke="#b8cbd7"/>
<text x="910" y="177" text-anchor="middle" class="head"><tspan x="910" dy="0">主管</tspan></text>
<text x="910" y="207" text-anchor="middle" class="body"><tspan x="910" dy="0">决定批准或拒绝</tspan><tspan x="910" dy="23">也具备操作员权限</tspan></text>
<rect x="55" y="350" width="310" height="100" rx="10" fill="#e8eff5" stroke="#b8cbd7"/>
<text x="210" y="382" text-anchor="middle" class="head"><tspan x="210" dy="0">订单与物流事实</tspan></text>
<text x="210" y="412" text-anchor="middle" class="body"><tspan x="210" dy="0">订单归属 原交易 商品范围</tspan><tspan x="210" dy="23">发货 签收 丢件证据</tspan></text>
<rect x="405" y="350" width="310" height="100" rx="10" fill="#e8eff5" stroke="#b8cbd7"/>
<text x="560" y="382" text-anchor="middle" class="head"><tspan x="560" dy="0">资格 金额与审批规则</tspan></text>
<text x="560" y="412" text-anchor="middle" class="body"><tspan x="560" dy="0">基础政策 → 金额审批</tspan><tspan x="560" dy="23">模型意图仍须确定性校验</tspan></text>
<rect x="755" y="350" width="310" height="100" rx="10" fill="#e8eff5" stroke="#b8cbd7"/>
<text x="910" y="382" text-anchor="middle" class="head"><tspan x="910" dy="0">原业务方案与关联</tspan></text>
<text x="910" y="412" text-anchor="middle" class="body"><tspan x="910" dy="0">售后 可选退款与审批</tspan><tspan x="910" dy="23">固定金额 绑定原客户会话</tspan></text>
<rect x="55" y="555" width="310" height="100" rx="10" fill="#e5f1e9" stroke="#b8cbd7"/>
<text x="210" y="587" text-anchor="middle" class="head"><tspan x="210" dy="0">仅退款</tspan></text>
<text x="210" y="617" text-anchor="middle" class="body"><tspan x="210" dy="0">自动授权或主管批准</tspan><tspan x="210" dy="23">然后执行原退款</tspan></text>
<rect x="405" y="555" width="310" height="100" rx="10" fill="#e5f1e9" stroke="#b8cbd7"/>
<text x="560" y="587" text-anchor="middle" class="head"><tspan x="560" dy="0">退货后退款</tspan></text>
<text x="560" y="617" text-anchor="middle" class="body"><tspan x="560" dy="0">自动授权或主管批准</tspan><tspan x="560" dy="23">客户寄回 → 操作员收货</tspan></text>
<rect x="755" y="555" width="310" height="100" rx="10" fill="#fff1d6" stroke="#b8cbd7"/>
<text x="910" y="587" text-anchor="middle" class="head"><tspan x="910" dy="0">审批与停止分支</tspan></text>
<text x="910" y="617" text-anchor="middle" class="body"><tspan x="910" dy="0">决定与后续意图共同保存</tspan><tspan x="910" dy="23">拒绝或安全过期停止原方案</tspan></text>
<rect x="55" y="760" width="310" height="100" rx="10" fill="#e8eff5" stroke="#b8cbd7"/>
<text x="210" y="792" text-anchor="middle" class="head"><tspan x="210" dy="0">持久命令与任务</tspan></text>
<text x="210" y="822" text-anchor="middle" class="body"><tspan x="210" dy="0">保存待办 后台推进</tspan><tspan x="210" dy="23">等待片段完成不等于退款完成</tspan></text>
<rect x="405" y="760" width="310" height="100" rx="10" fill="#e8eff5" stroke="#b8cbd7"/>
<text x="560" y="792" text-anchor="middle" class="head"><tspan x="560" dy="0">执行权与资金效果</tspan></text>
<text x="560" y="822" text-anchor="middle" class="body"><tspan x="560" dy="0">原业务键 发送前留存意图</tspan><tspan x="560" dy="23">已发送未确认时查询原交易</tspan></text>
<rect x="755" y="760" width="310" height="100" rx="10" fill="#e8eff5" stroke="#b8cbd7"/>
<text x="910" y="792" text-anchor="middle" class="head"><tspan x="910" dy="0">渠道结果与本地回写</tspan></text>
<text x="910" y="822" text-anchor="middle" class="body"><tspan x="910" dy="0">订单与资金渠道仍为模拟</tspan><tspan x="910" dy="23">明确成功 拒付或保留待核验</tspan></text>
<rect x="55" y="965" width="310" height="100" rx="10" fill="#e8eff5" stroke="#b8cbd7"/>
<text x="210" y="997" text-anchor="middle" class="head"><tspan x="210" dy="0">原会话结果与客户页面</tspan></text>
<text x="210" y="1027" text-anchor="middle" class="body"><tspan x="210" dy="0">回填原调用 公开事件</tspan><tspan x="210" dy="23">进度快照决定展示与操作</tspan></text>
<rect x="405" y="965" width="310" height="100" rx="10" fill="#e8eff5" stroke="#b8cbd7"/>
<text x="560" y="997" text-anchor="middle" class="head"><tspan x="560" dy="0">人工接管与本案结案</tspan></text>
<text x="560" y="1027" text-anchor="middle" class="body"><tspan x="560" dy="0">沟通可与原退款并行</tspan><tspan x="560" dy="23">核验本案资源后才允许结案</tspan></text>
<rect x="755" y="965" width="310" height="100" rx="10" fill="#e8eff5" stroke="#b8cbd7"/>
<text x="910" y="997" text-anchor="middle" class="head"><tspan x="910" dy="0">物流查询与服务评价</tspan></text>
<text x="910" y="1027" text-anchor="middle" class="body"><tspan x="910" dy="0">物流作为判断证据</tspan><tspan x="910" dy="23">评分不修改资金与售后结果</tspan></text>
<rect x="55" y="1120" width="1010" height="120" rx="10" fill="#fff1d6" stroke="#b8cbd7"/>
<text x="560" y="1162" text-anchor="middle" class="head"><tspan x="560" dy="0">已有领域与兼容能力 · B08</tspan></text>
<text x="560" y="1192" text-anchor="middle" class="body"><tspan x="560" dy="0">补偿  价保  换货尚未作为默认客户持久退款动作完整接入</tspan><tspan x="560" dy="23">换货现有收货后完成留痕 不代表库存与重新发货闭环</tspan></text>
<text x="560" y="1267" text-anchor="middle" class="label"><tspan x="560" dy="0">箭头表示层间责任交接 并非全部业务按五层串行执行 黄色表示条件分支或入口边界</tspan></text>
</svg>
