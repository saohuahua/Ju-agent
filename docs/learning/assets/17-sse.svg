<path d="M560 395V443H205V490" fill="none" stroke="#52758a" stroke-width="1.8"  marker-end="url(#arrow)"/>
<path d="M560 443V490" fill="none" stroke="#52758a" stroke-width="1.8"  marker-end="url(#arrow)"/>
<path d="M560 443H915V490" fill="none" stroke="#52758a" stroke-width="1.8"  marker-end="url(#arrow)"/>
<path d="M205 590V650H560V705" fill="none" stroke="#52758a" stroke-width="1.8"  marker-end="url(#arrow)"/>
<path d="M560 590V705" fill="none" stroke="#52758a" stroke-width="1.8"  marker-end="url(#arrow)"/>
<path d="M915 590V650H560" fill="none" stroke="#52758a" stroke-width="1.8"  marker-end="url(#arrow)"/>
<path d="M560 805V863H205V920" fill="none" stroke="#52758a" stroke-width="1.8"  marker-end="url(#arrow)"/>
<path d="M560 863V920" fill="none" stroke="#52758a" stroke-width="1.8"  marker-end="url(#arrow)"/>
<path d="M560 863H915V920" fill="none" stroke="#52758a" stroke-width="1.8"  marker-end="url(#arrow)"/>
<path d="M385 755H27V344H385" fill="none" stroke="#52758a" stroke-width="1.8" stroke-dasharray="6 5" marker-end="url(#arrow)"/>
<rect x="115" y="671" width="154" height="23" rx="4" fill="#f8fafb"/>
<text x="192" y="687" text-anchor="middle" class="label"><tspan x="192" dy="0">断线后从已收游标补发</tspan></text>
<rect x="385" y="120" width="350" height="90" rx="10" fill="#e5f0e9" stroke="#b8cbd7"/>
<text x="560" y="158.5" text-anchor="middle" class="head"><tspan x="560" dy="0">业务确认与结果投影</tspan></text>
<text x="560" y="188.5" text-anchor="middle" class="body"><tspan x="560" dy="0">原动作关联生成 agent_events</tspan></text>
<rect x="385" y="295" width="350" height="100" rx="10" fill="#e8eff5" stroke="#b8cbd7"/>
<text x="560" y="327" text-anchor="middle" class="head"><tspan x="560" dy="0">API 按 cursor 读取事件</tspan></text>
<text x="560" y="357" text-anchor="middle" class="body"><tspan x="560" dy="0">Last-Event-ID 之后的记录</tspan><tspan x="560" dy="23">追平后继续轮询</tspan></text>
<rect x="55" y="490" width="300" height="100" rx="10" fill="#e8eff5" stroke="#b8cbd7"/>
<text x="205" y="522" text-anchor="middle" class="head"><tspan x="205" dy="0">客户白名单投影</tspan></text>
<text x="205" y="552" text-anchor="middle" class="body"><tspan x="205" dy="0">保留原序号</tspan><tspan x="205" dy="23">隐藏内部类型与字段</tspan></text>
<rect x="410" y="490" width="300" height="100" rx="10" fill="#e8eff5" stroke="#b8cbd7"/>
<text x="560" y="522" text-anchor="middle" class="head"><tspan x="560" dy="0">隐藏批次水位</tspan></text>
<text x="560" y="552" text-anchor="middle" class="body"><tspan x="560" dy="0">stream.cursor</tspan><tspan x="560" dy="23">推进浏览器续传位置</tspan></text>
<rect x="765" y="490" width="300" height="100" rx="10" fill="#e8eff5" stroke="#b8cbd7"/>
<text x="915" y="522" text-anchor="middle" class="head"><tspan x="915" dy="0">终态再次追平</tspan></text>
<text x="915" y="552" text-anchor="middle" class="body"><tspan x="915" dy="0">没有最后遗漏事件</tspan><tspan x="915" dy="23">再发 stream.complete</tspan></text>
<rect x="385" y="705" width="350" height="100" rx="10" fill="#e8eff5" stroke="#b8cbd7"/>
<text x="560" y="737" text-anchor="middle" class="head"><tspan x="560" dy="0">浏览器 EventSource</tspan></text>
<text x="560" y="767" text-anchor="middle" class="body"><tspan x="560" dy="0">按原 ID 续传</tspan><tspan x="560" dy="23">完成帧主动关闭</tspan></text>
<rect x="55" y="920" width="300" height="105" rx="10" fill="#e8eff5" stroke="#b8cbd7"/>
<text x="205" y="954.5" text-anchor="middle" class="head"><tspan x="205" dy="0">按运行与序号归约</tspan></text>
<text x="205" y="984.5" text-anchor="middle" class="body"><tspan x="205" dy="0">忽略重复或旧事件</tspan><tspan x="205" dy="23">完整消息形成展示</tspan></text>
<rect x="410" y="920" width="300" height="105" rx="10" fill="#e8eff5" stroke="#b8cbd7"/>
<text x="560" y="954.5" text-anchor="middle" class="head"><tspan x="560" dy="0">切换身份或案件</tspan></text>
<text x="560" y="984.5" text-anchor="middle" class="body"><tspan x="560" dy="0">清理连接，使旧回调失效</tspan><tspan x="560" dy="23">按 token + runId 隔离</tspan></text>
<rect x="765" y="920" width="300" height="105" rx="10" fill="#e8eff5" stroke="#b8cbd7"/>
<text x="915" y="954.5" text-anchor="middle" class="head"><tspan x="915" dy="0">写请求迟到保护</tspan></text>
<text x="915" y="984.5" text-anchor="middle" class="body"><tspan x="915" dy="0">selectionRevision</tspan><tspan x="915" dy="23">原输入重试保留请求键</tspan></text>
<text x="560" y="1137" text-anchor="middle" class="label"><tspan x="560" dy="0">客户序号跳跃可能来自隐藏事件　数据库不主动推送　业务终态与传输完成分别处理</tspan></text>
</svg>
