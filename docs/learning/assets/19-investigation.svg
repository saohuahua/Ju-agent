<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="1200" viewBox="0 0 1120 1200" role="img" aria-labelledby="title desc"><title id="title">有限双分支调查：证据冻结、分支确认与父级建议</title><desc id="desc">两个分支没有资金端口　父级结果是建议，不是审批或退款成功</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L7 4L0 8" fill="#52758a"/></marker><style>text{font-family:'Microsoft YaHei','Noto Sans SC',sans-serif;fill:#253b49}.title{font-size:25px;font-weight:700}.subtitle{font-size:16px;fill:#607581}.head{font-size:19px;font-weight:700}.body{font-size:16px}.label{font-size:14px;fill:#405e70}.group{font-size:16px;font-weight:700;fill:#4c6b7d}</style></defs><rect width="1120" height="1200" fill="#f8fafb" rx="16"/>
<text x="560" y="43" text-anchor="middle" class="title"><tspan x="560" dy="0">有限双分支调查：证据冻结、分支确认与父级建议</tspan></text>
<text x="560" y="74" text-anchor="middle" class="subtitle"><tspan x="560" dy="0">两个分支没有资金端口　父级结果是建议，不是审批或退款成功</tspan></text>
<rect x="45" y="353" width="470" height="443" rx="14" fill="#f0f4f7" stroke="#cfdae1"/>
<text x="280" y="380" text-anchor="middle" class="group"><tspan x="280" dy="0">订单物流分支</tspan></text>
<rect x="605" y="353" width="470" height="443" rx="14" fill="#f0f4f7" stroke="#cfdae1"/>
<text x="840" y="380" text-anchor="middle" class="group"><tspan x="840" dy="0">政策分支</tspan></text>
<path d="M560 220V291H180V400H280V420" fill="none" stroke="#52758a" stroke-width="1.8"  marker-end="url(#arrow)"/>
<rect x="310" y="274" width="140" height="23" rx="4" fill="#f8fafb"/>
<text x="380" y="290" text-anchor="middle" class="label"><tspan x="380" dy="0">串行或并行模式冻结</tspan></text>
<path d="M560 291H940V400H840V420" fill="none" stroke="#52758a" stroke-width="1.8"  marker-end="url(#arrow)"/>
<path d="M280 520V639" fill="none" stroke="#52758a" stroke-width="1.8"  marker-end="url(#arrow)"/>
<path d="M840 520V639" fill="none" stroke="#52758a" stroke-width="1.8"  marker-end="url(#arrow)"/>
<path d="M280 739V820H560V860" fill="none" stroke="#52758a" stroke-width="1.8"  marker-end="url(#arrow)"/>
<path d="M840 739V820H560" fill="none" stroke="#52758a" stroke-width="1.8"  marker-end="url(#arrow)"/>
<path d="M560 960V1008H195V1050" fill="none" stroke="#52758a" stroke-width="1.8"  marker-end="url(#arrow)"/>
<path d="M560 1008V1050" fill="none" stroke="#52758a" stroke-width="1.8"  marker-end="url(#arrow)"/>
<path d="M560 1008H925V1050" fill="none" stroke="#52758a" stroke-width="1.8"  marker-end="url(#arrow)"/>
<rect x="375" y="120" width="370" height="100" rx="10" fill="#e5f0e9" stroke="#b8cbd7"/>
<text x="560" y="152" text-anchor="middle" class="head"><tspan x="560" dy="0">捕获并事务核验原证据</tspan></text>
<text x="560" y="182" text-anchor="middle" class="body"><tspan x="560" dy="0">客户 · 订单 · 原文 · 版本</tspan><tspan x="560" dy="23">父子任务共同受理</tspan></text>
<rect x="75" y="420" width="410" height="100" rx="10" fill="#e8eff5" stroke="#b8cbd7"/>
<text x="280" y="452" text-anchor="middle" class="head"><tspan x="280" dy="0">独立证据与结构化输出</tspan></text>
<text x="280" y="482" text-anchor="middle" class="body"><tspan x="280" dy="0">分支身份和原文先确认</tspan><tspan x="280" dy="23">P7 共享账本调用</tspan></text>
<rect x="635" y="420" width="410" height="100" rx="10" fill="#e8eff5" stroke="#b8cbd7"/>
<text x="840" y="452" text-anchor="middle" class="head"><tspan x="840" dy="0">独立证据与结构化输出</tspan></text>
<text x="840" y="482" text-anchor="middle" class="body"><tspan x="840" dy="0">同一冻结政策与知识快照</tspan><tspan x="840" dy="23">P7 共享账本调用</tspan></text>
<rect x="75" y="639" width="410" height="100" rx="10" fill="#e8eff5" stroke="#b8cbd7"/>
<text x="280" y="671" text-anchor="middle" class="head"><tspan x="280" dy="0">逐字段与引用核验</tspan></text>
<text x="280" y="701" text-anchor="middle" class="body"><tspan x="280" dy="0">租约有效且父流程未结束</tspan><tspan x="280" dy="23">确认结果与终态共同提交</tspan></text>
<rect x="635" y="639" width="410" height="100" rx="10" fill="#e8eff5" stroke="#b8cbd7"/>
<text x="840" y="671" text-anchor="middle" class="head"><tspan x="840" dy="0">逐字段与引用核验</tspan></text>
<text x="840" y="701" text-anchor="middle" class="body"><tspan x="840" dy="0">局部失败保留明确原因</tspan><tspan x="840" dy="23">不夹带伪造成功事实</tspan></text>
<rect x="380" y="860" width="360" height="100" rx="10" fill="#e8eff5" stroke="#b8cbd7"/>
<text x="560" y="892" text-anchor="middle" class="head"><tspan x="560" dy="0">父级确定性汇总</tspan></text>
<text x="560" y="922" text-anchor="middle" class="body"><tspan x="560" dy="0">复用领域规则生成建议</tspan><tspan x="560" dy="23">已确认分支不整体重跑</tspan></text>
<rect x="45" y="1050" width="300" height="90" rx="10" fill="#e5f0e9" stroke="#b8cbd7"/>
<text x="195" y="1088.5" text-anchor="middle" class="head"><tspan x="195" dy="0">controlled_review</tspan></text>
<text x="195" y="1118.5" text-anchor="middle" class="body"><tspan x="195" dy="0">交现有受控入口核验</tspan></text>
<rect x="410" y="1050" width="300" height="90" rx="10" fill="#fff2d8" stroke="#b8cbd7"/>
<text x="560" y="1088.5" text-anchor="middle" class="head"><tspan x="560" dy="0">ask_user</tspan></text>
<text x="560" y="1118.5" text-anchor="middle" class="body"><tspan x="560" dy="0">证据缺失需补充</tspan></text>
<rect x="775" y="1050" width="300" height="90" rx="10" fill="#fff2d8" stroke="#b8cbd7"/>
<text x="925" y="1088.5" text-anchor="middle" class="head"><tspan x="925" dy="0">human_review</tspan></text>
<text x="925" y="1118.5" text-anchor="middle" class="body"><tspan x="925" dy="0">冲突、局部失败或未知资金</tspan></text>
<text x="560" y="573" text-anchor="middle" class="label"><tspan x="560" dy="0">父取消传播到子任务</tspan><tspan x="560" dy="24">迟到结果不再确认</tspan></text>
<text x="560" y="255" text-anchor="middle" class="label"><tspan x="560" dy="0">同参重放返回原任务；新请求才重新核验当前源事实</tspan></text>
<text x="560" y="1177" text-anchor="middle" class="label"><tspan x="560" dy="0">运行记忆保存受理时事实，不持续刷新　未知资金保留 unknownActions　默认客户入口未接入 P8</tspan></text>
</svg>
