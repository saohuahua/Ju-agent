<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="640" viewBox="0 0 1120 640" role="img" aria-labelledby="title desc"><title id="title">扩展设计：部分失败后保留有效分支</title><desc id="desc">仅示意依赖关系　当前 P8 是固定双分支，不是本图的通用 DAG 调度器</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L7 4L0 8" fill="#52758a"/></marker><style>text{font-family:'Microsoft YaHei','Noto Sans SC',sans-serif;fill:#253b49}.title{font-size:25px;font-weight:700}.subtitle{font-size:16px;fill:#607581}.head{font-size:19px;font-weight:700}.body{font-size:16px}.label{font-size:14px;fill:#405e70}.group{font-size:16px;font-weight:700;fill:#4c6b7d}</style></defs><rect width="1120" height="640" fill="#f8fafb" rx="16"/>
<text x="560" y="43" text-anchor="middle" class="title"><tspan x="560" dy="0">扩展设计：部分失败后保留有效分支</tspan></text>
<text x="560" y="74" text-anchor="middle" class="subtitle"><tspan x="560" dy="0">仅示意依赖关系　当前 P8 是固定双分支，不是本图的通用 DAG 调度器</tspan></text>
<path d="M560 200V245H200V285" fill="none" stroke="#52758a" stroke-width="1.8"  marker-end="url(#arrow)"/>
<path d="M560 245V285" fill="none" stroke="#52758a" stroke-width="1.8"  marker-end="url(#arrow)"/>
<path d="M560 245H920V285" fill="none" stroke="#52758a" stroke-width="1.8"  marker-end="url(#arrow)"/>
<path d="M200 385V435H560V490" fill="none" stroke="#52758a" stroke-width="1.8"  marker-end="url(#arrow)"/>
<path d="M560 385V435" fill="none" stroke="#52758a" stroke-width="1.8"  marker-end="url(#arrow)"/>
<path d="M920 385V435H560" fill="none" stroke="#52758a" stroke-width="1.8"  marker-end="url(#arrow)"/>
<rect x="400" y="120" width="320" height="80" rx="10" fill="#e8eff5" stroke="#b8cbd7"/>
<text x="560" y="153.5" text-anchor="middle" class="head"><tspan x="560" dy="0">A 冻结输入</tspan></text>
<text x="560" y="183.5" text-anchor="middle" class="body"><tspan x="560" dy="0">客户 · 任务 · 来源版本</tspan></text>
<rect x="55" y="285" width="290" height="100" rx="10" fill="#e5f2ec" stroke="#b8cbd7"/>
<text x="200" y="328.5" text-anchor="middle" class="head"><tspan x="200" dy="0">B 订单证据</tspan></text>
<text x="200" y="358.5" text-anchor="middle" class="body"><tspan x="200" dy="0">已确认结果可复用</tspan></text>
<rect x="415" y="285" width="290" height="100" rx="10" fill="#e5f2ec" stroke="#b8cbd7"/>
<text x="560" y="328.5" text-anchor="middle" class="head"><tspan x="560" dy="0">C 政策证据</tspan></text>
<text x="560" y="358.5" text-anchor="middle" class="body"><tspan x="560" dy="0">已确认结果可复用</tspan></text>
<rect x="775" y="285" width="290" height="100" rx="10" fill="#fff2d8" stroke="#b8cbd7"/>
<text x="920" y="328.5" text-anchor="middle" class="head"><tspan x="920" dy="0">D 物流证据</tspan></text>
<text x="920" y="358.5" text-anchor="middle" class="body"><tspan x="920" dy="0">失败先分类，再决定重试</tspan></text>
<rect x="345" y="490" width="430" height="95" rx="10" fill="#e8eff5" stroke="#b8cbd7"/>
<text x="560" y="531" text-anchor="middle" class="head"><tspan x="560" dy="0">E 核验后汇总</tspan></text>
<text x="560" y="561" text-anchor="middle" class="body"><tspan x="560" dy="0">缺少必要证据则等待或保守结束</tspan></text>
<text x="560" y="617" text-anchor="middle" class="label"><tspan x="560" dy="0">输入版本改变时重新判断结果有效性　父取消后拒绝迟到确认　外部副作用仍按原交易核验</tspan></text>
</svg>
