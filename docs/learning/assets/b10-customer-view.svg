<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="795" viewBox="0 0 1120 795" role="img" aria-labelledby="title desc"><title id="title">从业务事实到客户页面</title><desc id="desc">快照决定当前进度与允许动作　事件解释过程　模型文案不作为资金证据</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L7 4L0 8" fill="#52758a"/></marker><style>text{font-family:'Microsoft YaHei','Noto Sans SC',sans-serif;fill:#253b49}.title{font-size:25px;font-weight:700}.subtitle{font-size:16px;fill:#607581}.head{font-size:19px;font-weight:700}.body{font-size:16px}.label{font-size:14px;fill:#405e70}.group{font-size:16px;font-weight:700;fill:#4c6b7d}</style></defs><rect width="1120" height="795" fill="#f8fafb" rx="16"/>
<text x="560" y="43" text-anchor="middle" class="title"><tspan x="560" dy="0">从业务事实到客户页面</tspan></text>
<text x="560" y="74" text-anchor="middle" class="subtitle"><tspan x="560" dy="0">快照决定当前进度与允许动作　事件解释过程　模型文案不作为资金证据</tspan></text>
<path d="M345 200H420" fill="none" stroke="#52758a" stroke-width="1.8"  marker-end="url(#arrow)"/>
<path d="M710 200H785" fill="none" stroke="#52758a" stroke-width="1.8"  marker-end="url(#arrow)"/>
<path d="M200 270V375" fill="none" stroke="#52758a" stroke-width="1.8" stroke-dasharray="6 5" marker-end="url(#arrow)"/>
<rect x="206" y="307" width="84" height="23" rx="4" fill="#f8fafb"/>
<text x="248" y="323" text-anchor="middle" class="label"><tspan x="248" dy="0">原运行关联</tspan></text>
<path d="M345 432H420" fill="none" stroke="#52758a" stroke-width="1.8"  marker-end="url(#arrow)"/>
<rect x="347" y="399" width="70" height="23" rx="4" fill="#f8fafb"/>
<text x="382" y="415" text-anchor="middle" class="label"><tspan x="382" dy="0">公开事件</tspan></text>
<path d="M565 375V270" fill="none" stroke="#52758a" stroke-width="1.8"  marker-end="url(#arrow)"/>
<rect x="580" y="312" width="70" height="23" rx="4" fill="#f8fafb"/>
<text x="615" y="328" text-anchor="middle" class="label"><tspan x="615" dy="0">重新读取</tspan></text>
<path d="M925 270V375" fill="none" stroke="#52758a" stroke-width="1.8"  marker-end="url(#arrow)"/>
<rect x="938" y="312" width="70" height="23" rx="4" fill="#f8fafb"/>
<text x="973" y="328" text-anchor="middle" class="label"><tspan x="973" dy="0">能力字段</tspan></text>
<path d="M710 432H785" fill="none" stroke="#52758a" stroke-width="1.8"  marker-end="url(#arrow)"/>
<rect x="714" y="398" width="70" height="23" rx="4" fill="#f8fafb"/>
<text x="749" y="414" text-anchor="middle" class="label"><tspan x="749" dy="0">页面恢复</tspan></text>
<path d="M55 143C55 126 345 126 345 143V257C345 274 55 274 55 257Z" fill="#e8eff5" stroke="#b8cbd7"/><ellipse cx="200" cy="143" rx="145" ry="13" fill="#e8eff5" stroke="#b8cbd7"/>
<text x="200" y="176.5" text-anchor="middle" class="head"><tspan x="200" dy="0">原业务事实</tspan></text>
<text x="200" y="206.5" text-anchor="middle" class="body"><tspan x="200" dy="0">售后与退款</tspan><tspan x="200" dy="23">审批与原关联</tspan><tspan x="200" dy="23">任务 执行权 资金效果</tspan></text>
<rect x="420" y="130" width="290" height="140" rx="10" fill="#e8eff5" stroke="#b8cbd7"/>
<text x="565" y="170.5" text-anchor="middle" class="head"><tspan x="565" dy="0">服务端一致读取</tspan></text>
<text x="565" y="200.5" text-anchor="middle" class="body"><tspan x="565" dy="0">验证原方案</tspan><tspan x="565" dy="23">按结果优先级计算</tspan><tspan x="565" dy="23">客户字段白名单</tspan></text>
<rect x="785" y="130" width="280" height="140" rx="10" fill="#e5f1e9" stroke="#b8cbd7"/>
<text x="925" y="170.5" text-anchor="middle" class="head"><tspan x="925" dy="0">客户进度卡</tspan></text>
<text x="925" y="200.5" text-anchor="middle" class="body"><tspan x="925" dy="0">明确成功或待核验</tspan><tspan x="925" dy="23">等待审批 寄回 收货</tspan><tspan x="925" dy="23">人工与其他结果</tspan></text>
<path d="M55 388C55 371 345 371 345 388V477C345 494 55 494 55 477Z" fill="#e8eff5" stroke="#b8cbd7"/><ellipse cx="200" cy="388" rx="145" ry="13" fill="#e8eff5" stroke="#b8cbd7"/>
<text x="200" y="420.5" text-anchor="middle" class="head"><tspan x="200" dy="0">会话与公开事件</tspan></text>
<text x="200" y="450.5" text-anchor="middle" class="body"><tspan x="200" dy="0">沟通状态与时间线</tspan><tspan x="200" dy="23">原运行与事件序号</tspan></text>
<rect x="420" y="375" width="290" height="115" rx="10" fill="#e8eff5" stroke="#b8cbd7"/>
<text x="565" y="414.5" text-anchor="middle" class="head"><tspan x="565" dy="0">查询与事件恢复</tspan></text>
<text x="565" y="444.5" text-anchor="middle" class="body"><tspan x="565" dy="0">重连补发与刷新快照</tspan><tspan x="565" dy="23">身份和运行切换隔离</tspan></text>
<rect x="785" y="375" width="280" height="115" rx="10" fill="#fff1d6" stroke="#b8cbd7"/>
<text x="925" y="414.5" text-anchor="middle" class="head"><tspan x="925" dy="0">表单与按钮</tspan></text>
<text x="925" y="444.5" text-anchor="middle" class="body"><tspan x="925" dy="0">按 canRegisterShipment</tspan><tspan x="925" dy="23">和会话状态开放动作</tspan></text>
<rect x="130" y="620" width="860" height="100" rx="10" fill="#f8e6e2" stroke="#b8cbd7"/>
<text x="560" y="652" text-anchor="middle" class="head"><tspan x="560" dy="0">判断优先级与风险边界</tspan></text>
<text x="560" y="682" text-anchor="middle" class="body"><tspan x="560" dy="0">完整成功优先　未知不被人工状态掩盖　请求成功不等于业务成功</tspan><tspan x="560" dy="23">关联人工运行的完成不能替代来源退款结果</tspan></text>
<text x="560" y="772" text-anchor="middle" class="label"><tspan x="560" dy="0">SSE 断线不停止后台任务　409 应刷新事实　网络响应丢失需保留原请求身份</tspan></text>
</svg>
