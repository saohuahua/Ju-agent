<rect x="230" y="304" width="56" height="23" rx="4" fill="#f8fafb"/>
<text x="258" y="320" text-anchor="middle" class="label"><tspan x="258" dy="0">缺信息</tspan></text>
<path d="M187 440V401H355V320H385" fill="none" stroke="#52758a" stroke-width="1.8" stroke-dasharray="6 5" marker-end="url(#arrow)"/>
<rect x="215" y="384" width="112" height="23" rx="4" fill="#f8fafb"/>
<text x="271" y="400" text-anchor="middle" class="label"><tspan x="271" dy="0">回复后继续取证</tspan></text>
