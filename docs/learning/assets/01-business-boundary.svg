<rect x="313" y="914" width="70" height="23" rx="4" fill="#f8fafb"/>
<text x="348" y="930" text-anchor="middle" class="label"><tspan x="348" dy="0">明确结果</tspan></text>
<path d="M560 930H835V973" fill="none" stroke="#52758a" stroke-width="1.8"  marker-end="url(#arrow)"/>
<rect x="713" y="914" width="70" height="23" rx="4" fill="#f8fafb"/>
<text x="748" y="930" text-anchor="middle" class="label"><tspan x="748" dy="0">无法确认</tspan></text>
<rect x="55" y="125" width="280" height="75" rx="10" fill="#e8eff5" stroke="#b8cbd7"/>
<text x="195" y="156" text-anchor="middle" class="head"><tspan x="195" dy="0">客户</tspan></text>
<text x="195" y="186" text-anchor="middle" class="body"><tspan x="195" dy="0">提出诉求与补充</tspan></text>
<rect x="420" y="125" width="280" height="75" rx="10" fill="#e8eff5" stroke="#b8cbd7"/>
<text x="560" y="156" text-anchor="middle" class="head"><tspan x="560" dy="0">操作员</tspan></text>
<text x="560" y="186" text-anchor="middle" class="body"><tspan x="560" dy="0">沟通与确认收货</tspan></text>
<rect x="785" y="125" width="280" height="75" rx="10" fill="#e8eff5" stroke="#b8cbd7"/>
<text x="925" y="156" text-anchor="middle" class="head"><tspan x="925" dy="0">主管</tspan></text>
<text x="925" y="186" text-anchor="middle" class="body"><tspan x="925" dy="0">审批与核验</tspan></text>
<rect x="385" y="275" width="350" height="90" rx="10" fill="#e8eff5" stroke="#b8cbd7"/>
<text x="560" y="313.5" text-anchor="middle" class="head"><tspan x="560" dy="0">会话 Worker 与 Agent</tspan></text>
<text x="560" y="343.5" text-anchor="middle" class="body"><tspan x="560" dy="0">查询订单、物流和政策</tspan></text>
<rect x="45" y="440" width="285" height="90" rx="10" fill="#fff2d8" stroke="#b8cbd7"/>
<text x="187.5" y="478.5" text-anchor="middle" class="head"><tspan x="187.5" dy="0">补问与等待</tspan></text>
<text x="187.5" y="508.5" text-anchor="middle" class="body"><tspan x="187.5" dy="0">保存原调用，回复后继续</tspan></text>
<rect x="385" y="440" width="350" height="90" rx="10" fill="#e8eff5" stroke="#b8cbd7"/>
<text x="560" y="478.5" text-anchor="middle" class="head"><tspan x="560" dy="0">领域方案核验</tspan></text>
<text x="560" y="508.5" text-anchor="middle" class="body"><tspan x="560" dy="0">归属 · 政策 · 金额 · 重复检查</tspan></text>
<rect x="790" y="440" width="285" height="90" rx="10" fill="#fff2d8" stroke="#b8cbd7"/>
<text x="932.5" y="478.5" text-anchor="middle" class="head"><tspan x="932.5" dy="0">审批决定</tspan></text>
<text x="932.5" y="508.5" text-anchor="middle" class="body"><tspan x="932.5" dy="0">绑定原资源与金额</tspan></text>
<rect x="385" y="605" width="350" height="90" rx="10" fill="#e8eff5" stroke="#b8cbd7"/>
<text x="560" y="643.5" text-anchor="middle" class="head"><tspan x="560" dy="0">持久业务任务</tspan></text>
<text x="560" y="673.5" text-anchor="middle" class="body"><tspan x="560" dy="0">退货还需寄回与确认收货</tspan></text>
<path d="M45 788C45 771 330 771 330 788V867C330 884 45 884 45 867Z" fill="#e5f0e9" stroke="#b8cbd7"/><ellipse cx="187.5" cy="788" rx="142.5" ry="13" fill="#e5f0e9" stroke="#b8cbd7"/>
<text x="187.5" y="827" text-anchor="middle" class="head"><tspan x="187.5" dy="0">业务 SQLite</tspan></text>
<text x="187.5" y="857" text-anchor="middle" class="body"><tspan x="187.5" dy="0">许可 · 意图 · 结果</tspan></text>
<rect x="385" y="775" width="350" height="105" rx="10" fill="#e8eff5" stroke="#b8cbd7"/>
<text x="560" y="809.5" text-anchor="middle" class="head"><tspan x="560" dy="0">资金 Worker</tspan></text>
<text x="560" y="839.5" text-anchor="middle" class="body"><tspan x="560" dy="0">首次发送获权</tspan><tspan x="560" dy="23">已有意图只查询</tspan></text>
<path d="M790 788C790 771 1075 771 1075 788V867C1075 884 790 884 790 867Z" fill="#e5f0e9" stroke="#b8cbd7"/><ellipse cx="932.5" cy="788" rx="142.5" ry="13" fill="#e5f0e9" stroke="#b8cbd7"/>
<text x="932.5" y="827" text-anchor="middle" class="head"><tspan x="932.5" dy="0">独立渠道 SQLite</tspan></text>
<text x="932.5" y="857" text-anchor="middle" class="body"><tspan x="932.5" dy="0">原业务键与交易结果</tspan></text>
<rect x="105" y="973" width="360" height="76" rx="10" fill="#e5f0e9" stroke="#b8cbd7"/>
<text x="285" y="1004.5" text-anchor="middle" class="head"><tspan x="285" dy="0">客户结果</tspan></text>
<text x="285" y="1034.5" text-anchor="middle" class="body"><tspan x="285" dy="0">确认后投影，经 SSE 推送</tspan></text>
<rect x="655" y="973" width="360" height="76" rx="10" fill="#fff2d8" stroke="#b8cbd7"/>
<text x="835" y="1004.5" text-anchor="middle" class="head"><tspan x="835" dy="0">结果未知</tspan></text>
<text x="835" y="1034.5" text-anchor="middle" class="body"><tspan x="835" dy="0">保留许可，等待核验</tspan></text>
<text x="560" y="1077" text-anchor="middle" class="label"><tspan x="560" dy="0">拒绝或过期不发送资金　等待收货不是退款完成　客户事件来自已确认业务事实</tspan></text>
</svg>
