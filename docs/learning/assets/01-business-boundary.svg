<text x="860" y="649" text-anchor="middle" class="label"><tspan x="860" dy="0">批准</tspan></text>
<path d="M560 530V605" fill="none" stroke="#52758a" stroke-width="1.8"  marker-end="url(#arrow)"/>
<rect x="563" y="553" width="70" height="23" rx="4" fill="#f8fafb"/>
<text x="598" y="569" text-anchor="middle" class="label"><tspan x="598" dy="0">自动批准</tspan></text>
<path d="M560 695V775" fill="none" stroke="#52758a" stroke-width="1.8"  marker-end="url(#arrow)"/>
<path d="M385 827H330" fill="none" stroke="#52758a" stroke-width="1.8"  marker-end="url(#arrow)"/>
<path d="M735 827H790" fill="none" stroke="#52758a" stroke-width="1.8"  marker-end="url(#arrow)"/>
