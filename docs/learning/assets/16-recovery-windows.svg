<rect x="799" y="1128" width="84" height="23" rx="4" fill="#f8fafb"/>
<text x="841" y="1144" text-anchor="middle" class="label"><tspan x="841" dy="0">查询仍未知</tspan></text>
<rect x="40" y="160" width="270" height="115" rx="10" fill="#e8eff5" stroke="#b8cbd7"/>
<text x="175" y="211" text-anchor="middle" class="head"><tspan x="175" dy="0">受理后，执行未开始</tspan></text>
<text x="175" y="241" text-anchor="middle" class="body"><tspan x="175" dy="0">命令已接受</tspan></text>
<rect x="390" y="160" width="340" height="115" rx="10" fill="#e5f0e9" stroke="#b8cbd7"/>
<text x="560" y="211" text-anchor="middle" class="head"><tspan x="560" dy="0">命令与任务存在</tspan></text>
<text x="560" y="241" text-anchor="middle" class="body"><tspan x="560" dy="0">客户请求键与原配置已保存</tspan></text>
<rect x="810" y="160" width="270" height="115" rx="10" fill="#e8eff5" stroke="#b8cbd7"/>
<text x="945" y="211" text-anchor="middle" class="head"><tspan x="945" dy="0">领取原任务</tspan></text>
<text x="945" y="241" text-anchor="middle" class="body"><tspan x="945" dy="0">不重新创建运行</tspan></text>
<rect x="40" y="360" width="270" height="115" rx="10" fill="#e8eff5" stroke="#b8cbd7"/>
<text x="175" y="411" text-anchor="middle" class="head"><tspan x="175" dy="0">模型或工具响应后</tspan></text>
<text x="175" y="441" text-anchor="middle" class="body"><tspan x="175" dy="0">尚未确认检查点</tspan></text>
<rect x="390" y="360" width="340" height="115" rx="10" fill="#e5f0e9" stroke="#b8cbd7"/>
<text x="560" y="411" text-anchor="middle" class="head"><tspan x="560" dy="0">已确认步骤才可复用</tspan></text>
<text x="560" y="441" text-anchor="middle" class="body"><tspan x="560" dy="0">半段流不当作完整结果</tspan></text>
<rect x="810" y="360" width="270" height="115" rx="10" fill="#e8eff5" stroke="#b8cbd7"/>
<text x="945" y="411" text-anchor="middle" class="head"><tspan x="945" dy="0">重做未确认步骤</tspan></text>
<text x="945" y="441" text-anchor="middle" class="body"><tspan x="945" dy="0">保留未知模型费用</tspan></text>
<rect x="40" y="560" width="270" height="115" rx="10" fill="#e8eff5" stroke="#b8cbd7"/>
<text x="175" y="611" text-anchor="middle" class="head"><tspan x="175" dy="0">业务受理之后</tspan></text>
<text x="175" y="641" text-anchor="middle" class="body"><tspan x="175" dy="0">审批或寄回可能仍在等待</tspan></text>
<rect x="390" y="560" width="340" height="115" rx="10" fill="#e5f0e9" stroke="#b8cbd7"/>
<text x="560" y="611" text-anchor="middle" class="head"><tspan x="560" dy="0">原售后与授权关联存在</tspan></text>
<text x="560" y="641" text-anchor="middle" class="body"><tspan x="560" dy="0">原工具 ID 与业务键不变</tspan></text>
<rect x="810" y="560" width="270" height="115" rx="10" fill="#e8eff5" stroke="#b8cbd7"/>
<text x="945" y="611" text-anchor="middle" class="head"><tspan x="945" dy="0">继续原业务</tspan></text>
<text x="945" y="641" text-anchor="middle" class="body"><tspan x="945" dy="0">不重复消费授权</tspan></text>
<rect x="40" y="760" width="270" height="115" rx="10" fill="#e8eff5" stroke="#b8cbd7"/>
<text x="175" y="811" text-anchor="middle" class="head"><tspan x="175" dy="0">渠道成功或可能成功</tspan></text>
<text x="175" y="841" text-anchor="middle" class="body"><tspan x="175" dy="0">本地尚未确认</tspan></text>
<rect x="390" y="760" width="340" height="115" rx="10" fill="#fff2d8" stroke="#b8cbd7"/>
<text x="560" y="811" text-anchor="middle" class="head"><tspan x="560" dy="0">发送许可与意图存在</tspan></text>
<text x="560" y="841" text-anchor="middle" class="body"><tspan x="560" dy="0">无成功记录不等于未发送</tspan></text>
<rect x="810" y="760" width="270" height="115" rx="10" fill="#e8eff5" stroke="#b8cbd7"/>
<text x="945" y="811" text-anchor="middle" class="head"><tspan x="945" dy="0">查询原交易</tspan></text>
<text x="945" y="841" text-anchor="middle" class="body"><tspan x="945" dy="0">未知则暂停核验</tspan></text>
<rect x="40" y="960" width="270" height="115" rx="10" fill="#e8eff5" stroke="#b8cbd7"/>
<text x="175" y="1011" text-anchor="middle" class="head"><tspan x="175" dy="0">业务已经确认</tspan></text>
<text x="175" y="1041" text-anchor="middle" class="body"><tspan x="175" dy="0">客户结果尚未投影</tspan></text>
<rect x="390" y="960" width="340" height="115" rx="10" fill="#e5f0e9" stroke="#b8cbd7"/>
<text x="560" y="1011" text-anchor="middle" class="head"><tspan x="560" dy="0">终态与资金确认存在</tspan></text>
<text x="560" y="1041" text-anchor="middle" class="body"><tspan x="560" dy="0">原关联尚未 projected</tspan></text>
<rect x="810" y="960" width="270" height="115" rx="10" fill="#e8eff5" stroke="#b8cbd7"/>
<text x="945" y="1011" text-anchor="middle" class="head"><tspan x="945" dy="0">只补结果投影</tspan></text>
<text x="945" y="1041" text-anchor="middle" class="body"><tspan x="945" dy="0">不重新退款或规划</tspan></text>
<rect x="360" y="1175" width="400" height="80" rx="10" fill="#fff2d8" stroke="#b8cbd7"/>
<text x="560" y="1208.5" text-anchor="middle" class="head"><tspan x="560" dy="0">无法确认时保留未知</tspan></text>
<text x="560" y="1238.5" text-anchor="middle" class="body"><tspan x="560" dy="0">人工接管或取消不清除发送依据</tspan></text>
<text x="560" y="1297" text-anchor="middle" class="label"><tspan x="560" dy="0">联合检查任务、业务、渠道计数与原事件　Windows 进程恢复不代替 Linux 容器验收</tspan></text>
</svg>
