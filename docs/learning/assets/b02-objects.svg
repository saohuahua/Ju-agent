<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="790" viewBox="0 0 1120 790" role="img" aria-labelledby="title desc"><title id="title">业务对象与执行对象关系</title><desc id="desc">连线注明主要关联身份　虚线表示逻辑关联而非全部数据库外键</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L7 4L0 8" fill="#52758a"/></marker><style>text{font-family:'Microsoft YaHei','Noto Sans SC',sans-serif;fill:#253b49}.title{font-size:25px;font-weight:700}.subtitle{font-size:16px;fill:#607581}.head{font-size:19px;font-weight:700}.body{font-size:16px}.label{font-size:14px;fill:#405e70}.group{font-size:16px;font-weight:700;fill:#4c6b7d}</style></defs><rect width="1120" height="790" fill="#f8fafb" rx="16"/>
<text x="560" y="43" text-anchor="middle" class="title"><tspan x="560" dy="0">业务对象与执行对象关系</tspan></text>
<text x="560" y="74" text-anchor="middle" class="subtitle"><tspan x="560" dy="0">连线注明主要关联身份　虚线表示逻辑关联而非全部数据库外键</tspan></text>
<path d="M320 192H425" fill="none" stroke="#52758a" stroke-width="1.8"  marker-end="url(#arrow)"/>
<rect x="337" y="160" width="70" height="23" rx="4" fill="#f8fafb"/>
<text x="372" y="176" text-anchor="middle" class="label"><tspan x="372" dy="0">订单关联</tspan></text>
<path d="M695 192H800" fill="none" stroke="#52758a" stroke-width="1.8"  marker-end="url(#arrow)"/>
<rect x="699" y="160" width="98" height="23" rx="4" fill="#f8fafb"/>
<text x="748" y="176" text-anchor="middle" class="label"><tspan x="748" dy="0">零或一笔退款</tspan></text>
<path d="M185 245V350" fill="none" stroke="#52758a" stroke-width="1.8" stroke-dasharray="6 5" marker-end="url(#arrow)"/>
<rect x="129" y="279" width="112" height="23" rx="4" fill="#f8fafb"/>
<text x="185" y="295" text-anchor="middle" class="label"><tspan x="185" dy="0">客户与订单线索</tspan></text>
<path d="M320 405H425" fill="none" stroke="#52758a" stroke-width="1.8" stroke-dasharray="6 5" marker-end="url(#arrow)"/>
<rect x="344" y="372" width="56" height="23" rx="4" fill="#f8fafb"/>
<text x="372" y="388" text-anchor="middle" class="label"><tspan x="372" dy="0">原运行</tspan></text>
<path d="M560 350V245" fill="none" stroke="#52758a" stroke-width="1.8" stroke-dasharray="6 5" marker-end="url(#arrow)"/>
<rect x="582" y="286" width="56" height="23" rx="4" fill="#f8fafb"/>
<text x="610" y="302" text-anchor="middle" class="label"><tspan x="610" dy="0">原售后</tspan></text>
<path d="M695 405H800" fill="none" stroke="#52758a" stroke-width="1.8" stroke-dasharray="6 5" marker-end="url(#arrow)"/>
<rect x="713" y="372" width="70" height="23" rx="4" fill="#f8fafb"/>
<text x="748" y="388" text-anchor="middle" class="label"><tspan x="748" dy="0">可选审批</tspan></text>
<path d="M185 460V575" fill="none" stroke="#52758a" stroke-width="1.8"  marker-end="url(#arrow)"/>
<rect x="198.25" y="507" width="51.5" height="23" rx="4" fill="#f8fafb"/>
<text x="224" y="523" text-anchor="middle" class="label"><tspan x="224" dy="0">runId</tspan></text>
<path d="M425 630H320" fill="none" stroke="#52758a" stroke-width="1.8" stroke-dasharray="6 5" marker-end="url(#arrow)"/>
<rect x="330" y="594" width="84" height="23" rx="4" fill="#f8fafb"/>
<text x="372" y="610" text-anchor="middle" class="label"><tspan x="372" dy="0">任务持有者</tspan></text>
<path d="M560 575V460" fill="none" stroke="#52758a" stroke-width="1.8" stroke-dasharray="6 5" marker-end="url(#arrow)"/>
<rect x="585" y="507" width="112" height="23" rx="4" fill="#f8fafb"/>
<text x="641" y="523" text-anchor="middle" class="label"><tspan x="641" dy="0">原授权与业务键</tspan></text>
<path d="M695 630H800" fill="none" stroke="#52758a" stroke-width="1.8"  marker-end="url(#arrow)"/>
<rect x="706" y="594" width="84" height="23" rx="4" fill="#f8fafb"/>
<text x="748" y="610" text-anchor="middle" class="label"><tspan x="748" dy="0">发送与查询</tspan></text>
<path d="M665 245V290H935V350" fill="none" stroke="#52758a" stroke-width="1.8" stroke-dasharray="6 5" marker-end="url(#arrow)"/>
<rect x="761" y="262" width="112" height="23" rx="4" fill="#f8fafb"/>
<text x="817" y="278" text-anchor="middle" class="label"><tspan x="817" dy="0">审批绑定原售后</tspan></text>
<path d="M50 153C50 136 320 136 320 153V232C320 249 50 249 50 232Z" fill="#e8eff5" stroke="#b8cbd7"/><ellipse cx="185" cy="153" rx="135" ry="13" fill="#e8eff5" stroke="#b8cbd7"/>
<text x="185" y="180.5" text-anchor="middle" class="head"><tspan x="185" dy="0">订单与商品</tspan></text>
<text x="185" y="210.5" text-anchor="middle" class="body"><tspan x="185" dy="0">orderNo　customerId</tspan><tspan x="185" dy="23">原交易与商品行</tspan></text>
<path d="M425 153C425 136 695 136 695 153V232C695 249 425 249 425 232Z" fill="#e5f1e9" stroke="#b8cbd7"/><ellipse cx="560" cy="153" rx="135" ry="13" fill="#e5f1e9" stroke="#b8cbd7"/>
<text x="560" y="180.5" text-anchor="middle" class="head"><tspan x="560" dy="0">售后单</tspan></text>
<text x="560" y="210.5" text-anchor="middle" class="body"><tspan x="560" dy="0">returnNo → orderNo</tspan><tspan x="560" dy="23">类型 原因 政策 金额</tspan></text>
<path d="M800 153C800 136 1070 136 1070 153V232C1070 249 800 249 800 232Z" fill="#e5f1e9" stroke="#b8cbd7"/><ellipse cx="935" cy="153" rx="135" ry="13" fill="#e5f1e9" stroke="#b8cbd7"/>
<text x="935" y="180.5" text-anchor="middle" class="head"><tspan x="935" dy="0">退款单</tspan></text>
<text x="935" y="210.5" text-anchor="middle" class="body"><tspan x="935" dy="0">refundNo → returnNo</tspan><tspan x="935" dy="23">金额 币种 业务键</tspan></text>
<path d="M50 363C50 346 320 346 320 363V447C320 464 50 464 50 447Z" fill="#e8eff5" stroke="#b8cbd7"/><ellipse cx="185" cy="363" rx="135" ry="13" fill="#e8eff5" stroke="#b8cbd7"/>
<text x="185" y="393" text-anchor="middle" class="head"><tspan x="185" dy="0">客户会话与事件</tspan></text>
<text x="185" y="423" text-anchor="middle" class="body"><tspan x="185" dy="0">runId</tspan><tspan x="185" dy="23">输入 补问 人工沟通</tspan></text>
<path d="M425 363C425 346 695 346 695 363V447C695 464 425 464 425 447Z" fill="#fff1d6" stroke="#b8cbd7"/><ellipse cx="560" cy="363" rx="135" ry="13" fill="#fff1d6" stroke="#b8cbd7"/>
<text x="560" y="393" text-anchor="middle" class="head"><tspan x="560" dy="0">原业务关联</tspan></text>
<text x="560" y="423" text-anchor="middle" class="body"><tspan x="560" dy="0">runId　toolCallId</tspan><tspan x="560" dy="23">returnNo　授权任务</tspan></text>
<path d="M800 363C800 346 1070 346 1070 363V447C1070 464 800 464 800 447Z" fill="#fff1d6" stroke="#b8cbd7"/><ellipse cx="935" cy="363" rx="135" ry="13" fill="#fff1d6" stroke="#b8cbd7"/>
<text x="935" y="393" text-anchor="middle" class="head"><tspan x="935" dy="0">审批与执行意图</tspan></text>
<text x="935" y="423" text-anchor="middle" class="body"><tspan x="935" dy="0">原资源与金额</tspan><tspan x="935" dy="23">决定及待交接工作</tspan></text>
<path d="M50 588C50 571 320 571 320 588V672C320 689 50 689 50 672Z" fill="#e8eff5" stroke="#b8cbd7"/><ellipse cx="185" cy="588" rx="135" ry="13" fill="#e8eff5" stroke="#b8cbd7"/>
<text x="185" y="618" text-anchor="middle" class="head"><tspan x="185" dy="0">命令与任务</tspan></text>
<text x="185" y="648" text-anchor="middle" class="body"><tspan x="185" dy="0">输入身份与执行片段</tspan><tspan x="185" dy="23">一个业务可有多个任务</tspan></text>
<path d="M425 588C425 571 695 571 695 588V672C695 689 425 689 425 672Z" fill="#e8eff5" stroke="#b8cbd7"/><ellipse cx="560" cy="588" rx="135" ry="13" fill="#e8eff5" stroke="#b8cbd7"/>
<text x="560" y="618" text-anchor="middle" class="head"><tspan x="560" dy="0">执行权与资金效果</tspan></text>
<text x="560" y="648" text-anchor="middle" class="body"><tspan x="560" dy="0">原业务键</tspan><tspan x="560" dy="23">发送资格与结果</tspan></text>
<path d="M800 588C800 571 1070 571 1070 588V672C1070 689 800 689 800 672Z" fill="#e5f1e9" stroke="#b8cbd7"/><ellipse cx="935" cy="588" rx="135" ry="13" fill="#e5f1e9" stroke="#b8cbd7"/>
<text x="935" y="618" text-anchor="middle" class="head"><tspan x="935" dy="0">独立模拟渠道</tspan></text>
<text x="935" y="648" text-anchor="middle" class="body"><tspan x="935" dy="0">同一业务键查询</tspan><tspan x="935" dy="23">渠道确认结果</tspan></text>
<text x="560" y="767" text-anchor="middle" class="label"><tspan x="560" dy="0">对象关系图不是执行时序图　任务完成与售后完成采用不同判据</tspan></text>
</svg>
