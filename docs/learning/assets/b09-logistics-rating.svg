<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="705" viewBox="0 0 1120 705" role="img" aria-labelledby="title desc"><title id="title">物流事实与服务评价</title><desc id="desc">物流参与资格判断　评价描述服务体验　两者不替代资金证据</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L7 4L0 8" fill="#52758a"/></marker><style>text{font-family:'Microsoft YaHei','Noto Sans SC',sans-serif;fill:#253b49}.title{font-size:25px;font-weight:700}.subtitle{font-size:16px;fill:#607581}.head{font-size:19px;font-weight:700}.body{font-size:16px}.label{font-size:14px;fill:#405e70}.group{font-size:16px;font-weight:700;fill:#4c6b7d}</style></defs><rect width="1120" height="705" fill="#f8fafb" rx="16"/>
<text x="560" y="43" text-anchor="middle" class="title"><tspan x="560" dy="0">物流事实与服务评价</tspan></text>
<text x="560" y="74" text-anchor="middle" class="subtitle"><tspan x="560" dy="0">物流参与资格判断　评价描述服务体验　两者不替代资金证据</tspan></text>
<path d="M280 240V330" fill="none" stroke="#52758a" stroke-width="1.8"  marker-end="url(#arrow)"/>
<rect x="224" y="271" width="112" height="23" rx="4" fill="#f8fafb"/>
<text x="280" y="287" text-anchor="middle" class="label"><tspan x="280" dy="0">供业务判定使用</tspan></text>
<path d="M840 240V330" fill="none" stroke="#52758a" stroke-width="1.8"  marker-end="url(#arrow)"/>
<rect x="791" y="271" width="98" height="23" rx="4" fill="#f8fafb"/>
<text x="840" y="287" text-anchor="middle" class="label"><tspan x="840" dy="0">检查提交条件</tspan></text>
<path d="M840 445V535" fill="none" stroke="#52758a" stroke-width="1.8"  marker-end="url(#arrow)"/>
<rect x="791" y="476" width="98" height="23" rx="4" fill="#f8fafb"/>
<text x="840" y="492" text-anchor="middle" class="label"><tspan x="840" dy="0">独立保存评分</tspan></text>
<path d="M280 535V445" fill="none" stroke="#52758a" stroke-width="1.8" stroke-dasharray="6 5" marker-end="url(#arrow)"/>
<rect x="203" y="476" width="154" height="23" rx="4" fill="#f8fafb"/>
<text x="280" y="492" text-anchor="middle" class="label"><tspan x="280" dy="0">仅支持的路径更新物流</tspan></text>
<rect x="60" y="130" width="440" height="110" rx="10" fill="#e8eff5" stroke="#b8cbd7"/>
<text x="280" y="167" text-anchor="middle" class="head"><tspan x="280" dy="0">物流查询</tspan></text>
<text x="280" y="197" text-anchor="middle" class="body"><tspan x="280" dy="0">先核对本人订单</tspan><tspan x="280" dy="23">读取已有状态与轨迹</tspan></text>
<rect x="620" y="130" width="440" height="110" rx="10" fill="#e8eff5" stroke="#b8cbd7"/>
<text x="840" y="167" text-anchor="middle" class="head"><tspan x="840" dy="0">客户评价</tspan></text>
<text x="840" y="197" text-anchor="middle" class="body"><tspan x="840" dy="0">本人会话 一次评价</tspan><tspan x="840" dy="23">1 到 5 的整数</tspan></text>
<rect x="60" y="330" width="440" height="115" rx="10" fill="#e8eff5" stroke="#b8cbd7"/>
<text x="280" y="369.5" text-anchor="middle" class="head"><tspan x="280" dy="0">规则读取不同事实</tspan></text>
<text x="280" y="399.5" text-anchor="middle" class="body"><tspan x="280" dy="0">丢件读取运单 lost</tspan><tspan x="280" dy="23">窗口读取订单 deliveredAt</tspan></text>
<rect x="620" y="330" width="440" height="115" rx="10" fill="#e8eff5" stroke="#b8cbd7"/>
<text x="840" y="369.5" text-anchor="middle" class="head"><tspan x="840" dy="0">评价开放状态</tspan></text>
<text x="840" y="399.5" text-anchor="middle" class="body"><tspan x="840" dy="0">完成 失败 取消 升级 人工处理中</tspan><tspan x="840" dy="23">评价不改变业务结果</tspan></text>
<rect x="60" y="535" width="440" height="105" rx="10" fill="#fff1d6" stroke="#b8cbd7"/>
<text x="280" y="569.5" text-anchor="middle" class="head"><tspan x="280" dy="0">主动事件的入口边界</tspan></text>
<text x="280" y="599.5" text-anchor="middle" class="body"><tspan x="280" dy="0">旧路径允许受控模拟注入</tspan><tspan x="280" dy="23">当前持久会话拒绝主动注入</tspan></text>
<rect x="620" y="535" width="440" height="105" rx="10" fill="#e5f1e9" stroke="#b8cbd7"/>
<text x="840" y="569.5" text-anchor="middle" class="head"><tspan x="840" dy="0">体验与业务分别统计</tspan></text>
<text x="840" y="599.5" text-anchor="middle" class="body"><tspan x="840" dy="0">评分不证明退款成功</tspan><tspan x="840" dy="23">customer 来源不等于生产用户</tspan></text>
<text x="560" y="682" text-anchor="middle" class="label"><tspan x="560" dy="0">物流注入不自动写订单签收时间　寄回登记也不等于仓库收货</tspan></text>
</svg>
