<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="830" viewBox="0 0 1120 830" role="img" aria-labelledby="title desc"><title id="title">资格金额与审批决策</title><desc id="desc">完整入口 decidePolicy 先匹配基础规则 再叠加金额审批</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L7 4L0 8" fill="#52758a"/></marker><style>text{font-family:'Microsoft YaHei','Noto Sans SC',sans-serif;fill:#253b49}.title{font-size:25px;font-weight:700}.subtitle{font-size:16px;fill:#607581}.head{font-size:19px;font-weight:700}.body{font-size:16px}.label{font-size:14px;fill:#405e70}.group{font-size:16px;font-weight:700;fill:#4c6b7d}</style></defs><rect width="1120" height="830" fill="#f8fafb" rx="16"/>
<text x="560" y="43" text-anchor="middle" class="title"><tspan x="560" dy="0">资格金额与审批决策</tspan></text>
<text x="560" y="74" text-anchor="middle" class="subtitle"><tspan x="560" dy="0">完整入口 decidePolicy 先匹配基础规则 再叠加金额审批</tspan></text>
<path d="M345 165H435" fill="none" stroke="#52758a" stroke-width="1.8"  marker-end="url(#arrow)"/>
<rect x="355" y="129" width="70" height="23" rx="4" fill="#f8fafb"/>
<text x="390" y="145" text-anchor="middle" class="label"><tspan x="390" dy="0">检查通过</tspan></text>
<path d="M570 220V300" fill="none" stroke="#52758a" stroke-width="1.8"  marker-end="url(#arrow)"/>
<rect x="591" y="246" width="112" height="23" rx="4" fill="#f8fafb"/>
<text x="647" y="262" text-anchor="middle" class="label"><tspan x="647" dy="0">订单与物流事实</tspan></text>
<path d="M345 150V100H930V120" fill="none" stroke="#52758a" stroke-width="1.8"  marker-end="url(#arrow)"/>
<rect x="705" y="82" width="70" height="23" rx="4" fill="#f8fafb"/>
<text x="740" y="98" text-anchor="middle" class="label"><tspan x="740" dy="0">检查失败</tspan></text>
<path d="M435 352H200V495" fill="none" stroke="#52758a" stroke-width="1.8"  marker-end="url(#arrow)"/>
<rect x="231" y="322" width="44" height="23" rx="4" fill="#f8fafb"/>
<text x="253" y="338" text-anchor="middle" class="label"><tspan x="253" dy="0">deny</tspan></text>
<path d="M570 405V495" fill="none" stroke="#52758a" stroke-width="1.8"  marker-end="url(#arrow)"/>
<rect x="584.25" y="439" width="51.5" height="23" rx="4" fill="#f8fafb"/>
<text x="610" y="455" text-anchor="middle" class="label"><tspan x="610" dy="0">allow</tspan></text>
<path d="M705 352H930V495" fill="none" stroke="#52758a" stroke-width="1.8"  marker-end="url(#arrow)"/>
<rect x="775.5" y="322" width="119" height="23" rx="4" fill="#f8fafb"/>
<text x="835" y="338" text-anchor="middle" class="label"><tspan x="835" dy="0">needs_approval</tspan></text>
<path d="M555 600V675" fill="none" stroke="#52758a" stroke-width="1.8"  marker-end="url(#arrow)"/>
<rect x="561" y="625" width="70" height="23" rx="4" fill="#f8fafb"/>
<text x="596" y="641" text-anchor="middle" class="label"><tspan x="596" dy="0">低于阈值</tspan></text>
<path d="M705 547H750V725H795" fill="none" stroke="#52758a" stroke-width="1.8"  marker-end="url(#arrow)"/>
<rect x="721" y="628" width="70" height="23" rx="4" fill="#f8fafb"/>
<text x="756" y="644" text-anchor="middle" class="label"><tspan x="756" dy="0">达到阈值</tspan></text>
<path d="M930 600V675" fill="none" stroke="#52758a" stroke-width="1.8"  marker-end="url(#arrow)"/>
<rect x="55" y="120" width="290" height="100" rx="10" fill="#e8eff5" stroke="#b8cbd7"/>
<text x="200" y="152" text-anchor="middle" class="head"><tspan x="200" dy="0">受理检查</tspan></text>
<text x="200" y="182" text-anchor="middle" class="body"><tspan x="200" dy="0">可信身份　订单存在</tspan><tspan x="200" dy="23">重复售后占位</tspan></text>
<rect x="435" y="300" width="270" height="105" rx="10" fill="#e8eff5" stroke="#b8cbd7"/>
<text x="570" y="334.5" text-anchor="middle" class="head"><tspan x="570" dy="0">基础规则按序匹配</tspan></text>
<text x="570" y="364.5" text-anchor="middle" class="body"><tspan x="570" dy="0">R1 未发货　R2 丢件</tspan><tspan x="570" dy="23">R3 质量　R4 无理由</tspan></text>
<rect x="435" y="120" width="270" height="100" rx="10" fill="#e8eff5" stroke="#b8cbd7"/>
<text x="570" y="152" text-anchor="middle" class="head"><tspan x="570" dy="0">金额依据</tspan></text>
<text x="570" y="182" text-anchor="middle" class="body"><tspan x="570" dy="0">整单取订单总额</tspan><tspan x="570" dy="23">部分取商品行小计</tspan></text>
<rect x="795" y="120" width="270" height="100" rx="10" fill="#f8e6e2" stroke="#b8cbd7"/>
<text x="930" y="152" text-anchor="middle" class="head"><tspan x="930" dy="0">受理错误</tspan></text>
<text x="930" y="182" text-anchor="middle" class="body"><tspan x="930" dy="0">越权 不存在 冲突</tspan><tspan x="930" dy="23">不以政策拒绝代替</tspan></text>
<rect x="55" y="495" width="290" height="100" rx="10" fill="#f8e6e2" stroke="#b8cbd7"/>
<text x="200" y="527" text-anchor="middle" class="head"><tspan x="200" dy="0">基础拒绝或无匹配</tspan></text>
<text x="200" y="557" text-anchor="middle" class="body"><tspan x="200" dy="0">保存 rejected 售后</tspan><tspan x="200" dy="23">不预留退款</tspan></text>
<rect x="435" y="495" width="270" height="105" rx="10" fill="#e8eff5" stroke="#b8cbd7"/>
<text x="570" y="529.5" text-anchor="middle" class="head"><tspan x="570" dy="0">基础允许</tspan></text>
<text x="570" y="559.5" text-anchor="middle" class="body"><tspan x="570" dy="0">allow</tspan><tspan x="570" dy="23">叠加退款金额阈值</tspan></text>
<rect x="795" y="495" width="270" height="105" rx="10" fill="#fff1d6" stroke="#b8cbd7"/>
<text x="930" y="529.5" text-anchor="middle" class="head"><tspan x="930" dy="0">原因本身需审批</tspan></text>
<text x="930" y="559.5" text-anchor="middle" class="body"><tspan x="930" dy="0">质量问题仅退款</tspan><tspan x="930" dy="23">不因小额自动通过</tspan></text>
<rect x="400" y="675" width="305" height="100" rx="10" fill="#e5f1e9" stroke="#b8cbd7"/>
<text x="552.5" y="707" text-anchor="middle" class="head"><tspan x="552.5" dy="0">自动授权</tspan></text>
<text x="552.5" y="737" text-anchor="middle" class="body"><tspan x="552.5" dy="0">金额低于 5000 元</tspan><tspan x="552.5" dy="23">原业务持久受理</tspan></text>
<rect x="795" y="675" width="275" height="100" rx="10" fill="#fff1d6" stroke="#b8cbd7"/>
<text x="932.5" y="707" text-anchor="middle" class="head"><tspan x="932.5" dy="0">主管审批</tspan></text>
<text x="932.5" y="737" text-anchor="middle" class="body"><tspan x="932.5" dy="0">金额达到 5000 元</tspan><tspan x="932.5" dy="23">或基础已需人工</tspan></text>
<text x="560" y="807" text-anchor="middle" class="label"><tspan x="560" dy="0">补偿另用 50 元阈值且等号在自动侧　时间窗口按精确时间差判断</tspan></text>
</svg>
