<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="1190" viewBox="0 0 1120 1190" role="img" aria-labelledby="title desc"><title id="title">政策检索与资格判定：两条链共同支撑解释</title><desc id="desc">左侧找到可追溯依据　右侧判断真实业务是否允许　相关性分数不是退款授权</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L7 4L0 8" fill="#52758a"/></marker><style>text{font-family:'Microsoft YaHei','Noto Sans SC',sans-serif;fill:#253b49}.title{font-size:25px;font-weight:700}.subtitle{font-size:16px;fill:#607581}.head{font-size:19px;font-weight:700}.body{font-size:16px}.label{font-size:14px;fill:#405e70}.group{font-size:16px;font-weight:700;fill:#4c6b7d}</style></defs><rect width="1120" height="1190" fill="#f8fafb" rx="16"/>
<text x="560" y="43" text-anchor="middle" class="title"><tspan x="560" dy="0">政策检索与资格判定：两条链共同支撑解释</tspan></text>
<text x="560" y="74" text-anchor="middle" class="subtitle"><tspan x="560" dy="0">左侧找到可追溯依据　右侧判断真实业务是否允许　相关性分数不是退款授权</tspan></text>
<rect x="35" y="110" width="470" height="890" rx="14" fill="#f0f4f7" stroke="#cfdae1"/>
<text x="270" y="137" text-anchor="middle" class="group"><tspan x="270" dy="0">知识证据链</tspan></text>
<rect x="615" y="110" width="470" height="890" rx="14" fill="#f0f4f7" stroke="#cfdae1"/>
<text x="850" y="137" text-anchor="middle" class="group"><tspan x="850" dy="0">业务判定链</tspan></text>
<path d="M270 272V355" fill="none" stroke="#52758a" stroke-width="1.8"  marker-end="url(#arrow)"/>
<path d="M270 460V540" fill="none" stroke="#52758a" stroke-width="1.8"  marker-end="url(#arrow)"/>
<path d="M270 646V737" fill="none" stroke="#52758a" stroke-width="1.8"  marker-end="url(#arrow)"/>
<path d="M850 272V355" fill="none" stroke="#52758a" stroke-width="1.8"  marker-end="url(#arrow)"/>
<path d="M850 460V540" fill="none" stroke="#52758a" stroke-width="1.8"  marker-end="url(#arrow)"/>
<path d="M850 646V737" fill="none" stroke="#52758a" stroke-width="1.8"  marker-end="url(#arrow)"/>
<path d="M270 847V870H65V1005H560V1050" fill="none" stroke="#52758a" stroke-width="1.8"  marker-end="url(#arrow)"/>
<path d="M850 847V870H1055V1005H560" fill="none" stroke="#52758a" stroke-width="1.8"  marker-end="url(#arrow)"/>
<path d="M450 792H670" fill="none" stroke="#52758a" stroke-width="1.8" stroke-dasharray="6 5" marker-end="url(#arrow)"/>
<rect x="483" y="765" width="154" height="23" rx="4" fill="#f8fafb"/>
<text x="560" y="781" text-anchor="middle" class="label"><tspan x="560" dy="0">解释辅助，不代替授权</tspan></text>
<rect x="90" y="178" width="360" height="94" rx="10" fill="#e8eff5" stroke="#b8cbd7"/>
<text x="270" y="207" text-anchor="middle" class="head"><tspan x="270" dy="0">政策原文与版本</tspan></text>
<text x="270" y="237" text-anchor="middle" class="body"><tspan x="270" dy="0">19 篇演示政策</tspan><tspan x="270" dy="23">稳定内容身份</tspan></text>
<rect x="90" y="355" width="360" height="105" rx="10" fill="#e8eff5" stroke="#b8cbd7"/>
<text x="270" y="389.5" text-anchor="middle" class="head"><tspan x="270" dy="0">快照与分块</tspan></text>
<text x="270" y="419.5" text-anchor="middle" class="body"><tspan x="270" dy="0">段落优先，320 UTF-16 窗口</tspan><tspan x="270" dy="23">原文偏移与修订标识</tspan></text>
<rect x="90" y="540" width="360" height="106" rx="10" fill="#e8eff5" stroke="#b8cbd7"/>
<text x="270" y="575" text-anchor="middle" class="head"><tspan x="270" dy="0">查询与排序</tspan></text>
<text x="270" y="605" text-anchor="middle" class="body"><tspan x="270" dy="0">字符基线 按版本取3或5条</tspan><tspan x="270" dy="23">BM25 为已有对照模块</tspan></text>
<rect x="90" y="737" width="360" height="110" rx="10" fill="#e8eff5" stroke="#b8cbd7"/>
<text x="270" y="774" text-anchor="middle" class="head"><tspan x="270" dy="0">去重片段与来源</tspan></text>
<text x="270" y="804" text-anchor="middle" class="body"><tspan x="270" dy="0">articleId · revision · offset</tspan><tspan x="270" dy="23">引用存在不等于支持答案</tspan></text>
<rect x="670" y="178" width="360" height="94" rx="10" fill="#e8eff5" stroke="#b8cbd7"/>
<text x="850" y="207" text-anchor="middle" class="head"><tspan x="850" dy="0">订单与客户事实</tspan></text>
<text x="850" y="237" text-anchor="middle" class="body"><tspan x="850" dy="0">归属 · 状态 · 物流</tspan><tspan x="850" dy="23">客户选择与原因</tspan></text>
<rect x="670" y="355" width="360" height="105" rx="10" fill="#e8eff5" stroke="#b8cbd7"/>
<text x="850" y="389.5" text-anchor="middle" class="head"><tspan x="850" dy="0">确定性政策引擎</tspan></text>
<text x="850" y="419.5" text-anchor="middle" class="body"><tspan x="850" dy="0">类型 · 时限 · 商品范围</tspan><tspan x="850" dy="23">计算金额与处理条件</tspan></text>
<rect x="670" y="540" width="360" height="106" rx="10" fill="#e8eff5" stroke="#b8cbd7"/>
<text x="850" y="575" text-anchor="middle" class="head"><tspan x="850" dy="0">允许 / 拒绝 / 需审批</tspan></text>
<text x="850" y="605" text-anchor="middle" class="body"><tspan x="850" dy="0">原方案与授权绑定</tspan><tspan x="850" dy="23">不信任模型传入金额</tspan></text>
<rect x="670" y="737" width="360" height="110" rx="10" fill="#e8eff5" stroke="#b8cbd7"/>
<text x="850" y="774" text-anchor="middle" class="head"><tspan x="850" dy="0">持久业务受理</tspan></text>
<text x="850" y="804" text-anchor="middle" class="body"><tspan x="850" dy="0">满足条件才可进入执行</tspan><tspan x="850" dy="23">结果由领域与渠道确认</tspan></text>
<rect x="350" y="1050" width="420" height="85" rx="10" fill="#e5f0e9" stroke="#b8cbd7"/>
<text x="560" y="1086" text-anchor="middle" class="head"><tspan x="560" dy="0">客户解释与证据核验</tspan></text>
<text x="560" y="1116" text-anchor="middle" class="body"><tspan x="560" dy="0">检索依据 + 真实业务结果</tspan></text>
<text x="270" y="903" text-anchor="middle" class="label"><tspan x="270" dy="0">快照不匹配时明确失败</tspan><tspan x="270" dy="24">不静默换成新政策</tspan></text>
<text x="850" y="903" text-anchor="middle" class="label"><tspan x="850" dy="0">金额来自业务事实</tspan><tspan x="850" dy="24">检索分数不能批准退款</tspan></text>
<text x="560" y="1167" text-anchor="middle" class="label"><tspan x="560" dy="0">历史检索实验未运行答案生成　未实现向量融合与多版本持久索引发布</tspan></text>
</svg>
