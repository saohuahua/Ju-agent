<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="1160" viewBox="0 0 1120 1160" role="img" aria-labelledby="title desc"><title id="title">模型预算：先预占，每次尝试独立结算</title><desc id="desc">所有用途共享预算 scope　金额占用与并发占位分别计算　未知不等于免费</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L7 4L0 8" fill="#52758a"/></marker><style>text{font-family:'Microsoft YaHei','Noto Sans SC',sans-serif;fill:#253b49}.title{font-size:25px;font-weight:700}.subtitle{font-size:16px;fill:#607581}.head{font-size:19px;font-weight:700}.body{font-size:16px}.label{font-size:14px;fill:#405e70}.group{font-size:16px;font-weight:700;fill:#4c6b7d}</style></defs><rect width="1120" height="1160" fill="#f8fafb" rx="16"/>
<text x="560" y="43" text-anchor="middle" class="title"><tspan x="560" dy="0">模型预算：先预占，每次尝试独立结算</tspan></text>
<text x="560" y="74" text-anchor="middle" class="subtitle"><tspan x="560" dy="0">所有用途共享预算 scope　金额占用与并发占位分别计算　未知不等于免费</tspan></text>
<path d="M560 215V290" fill="none" stroke="#52758a" stroke-width="1.8"  marker-end="url(#arrow)"/>
<path d="M560 390V470" fill="none" stroke="#52758a" stroke-width="1.8"  marker-end="url(#arrow)"/>
<path d="M355 520H390" fill="none" stroke="#52758a" stroke-width="1.8"  marker-end="url(#arrow)"/>
<path d="M730 520H765" fill="none" stroke="#52758a" stroke-width="1.8"  marker-end="url(#arrow)"/>
<path d="M915 470V340H730" fill="none" stroke="#52758a" stroke-width="1.8"  marker-end="url(#arrow)"/>
<rect x="786" y="324" width="126" height="23" rx="4" fill="#f8fafb"/>
<text x="849" y="340" text-anchor="middle" class="label"><tspan x="849" dy="0">允许重试仍先预占</tspan></text>
<path d="M560 570V634H205V695" fill="none" stroke="#52758a" stroke-width="1.8"  marker-end="url(#arrow)"/>
<path d="M560 634V695" fill="none" stroke="#52758a" stroke-width="1.8"  marker-end="url(#arrow)"/>
<path d="M560 634H915V695" fill="none" stroke="#52758a" stroke-width="1.8"  marker-end="url(#arrow)"/>
<path d="M205 800V871H560V962" fill="none" stroke="#52758a" stroke-width="1.8"  marker-end="url(#arrow)"/>
<path d="M560 800V962" fill="none" stroke="#52758a" stroke-width="1.8"  marker-end="url(#arrow)"/>
<path d="M915 800V871H560" fill="none" stroke="#52758a" stroke-width="1.8"  marker-end="url(#arrow)"/>
<rect x="390" y="125" width="340" height="90" rx="10" fill="#e8eff5" stroke="#b8cbd7"/>
<text x="560" y="163.5" text-anchor="middle" class="head"><tspan x="560" dy="0">冻结配置与价格</tspan></text>
<text x="560" y="193.5" text-anchor="middle" class="body"><tspan x="560" dy="0">模型能力 · 价格版本 · 原快照</tspan></text>
<rect x="390" y="290" width="340" height="100" rx="10" fill="#e5f0e9" stroke="#b8cbd7"/>
<text x="560" y="322" text-anchor="middle" class="head"><tspan x="560" dy="0">事务预占</tspan></text>
<text x="560" y="352" text-anchor="middle" class="body"><tspan x="560" dy="0">检查 committed 与并发限制</tspan><tspan x="560" dy="23">写 held 后才发起调用</tspan></text>
<rect x="55" y="470" width="300" height="100" rx="10" fill="#e8eff5" stroke="#b8cbd7"/>
<text x="205" y="502" text-anchor="middle" class="head"><tspan x="205" dy="0">逻辑 operationId</tspan></text>
<text x="205" y="532" text-anchor="middle" class="body"><tspan x="205" dy="0">一次模型意图</tspan><tspan x="205" dy="23">下辖独立 attempt</tspan></text>
<rect x="390" y="470" width="340" height="100" rx="10" fill="#e8eff5" stroke="#b8cbd7"/>
<text x="560" y="502" text-anchor="middle" class="head"><tspan x="560" dy="0">实际调用</tspan></text>
<text x="560" y="532" text-anchor="middle" class="body"><tspan x="560" dy="0">callId 对应一次尝试</tspan><tspan x="560" dy="23">支持取消与超时</tspan></text>
<rect x="765" y="470" width="300" height="100" rx="10" fill="#e8eff5" stroke="#b8cbd7"/>
<text x="915" y="502" text-anchor="middle" class="head"><tspan x="915" dy="0">有限重试</tspan></text>
<text x="915" y="532" text-anchor="middle" class="body"><tspan x="915" dy="0">仅允许的限流或上游错误</tspan><tspan x="915" dy="23">每次重新预占</tspan></text>
<rect x="55" y="695" width="300" height="105" rx="10" fill="#e5f0e9" stroke="#b8cbd7"/>
<text x="205" y="729.5" text-anchor="middle" class="head"><tspan x="205" dy="0">有效 usage</tspan></text>
<text x="205" y="759.5" text-anchor="middle" class="body"><tspan x="205" dy="0">按原价格算 actual</tspan><tspan x="205" dy="23">settled 记录实际成本</tspan></text>
<rect x="410" y="695" width="300" height="105" rx="10" fill="#fff2d8" stroke="#b8cbd7"/>
<text x="560" y="729.5" text-anchor="middle" class="head"><tspan x="560" dy="0">缺失或无法确认用量</tspan></text>
<text x="560" y="759.5" text-anchor="middle" class="body"><tspan x="560" dy="0">unknown 保留 reserved</tspan><tspan x="560" dy="23">不伪造零用量</tspan></text>
<rect x="765" y="695" width="300" height="105" rx="10" fill="#fff2d8" stroke="#b8cbd7"/>
<text x="915" y="729.5" text-anchor="middle" class="head"><tspan x="915" dy="0">进程退出未结算</tspan></text>
<text x="915" y="759.5" text-anchor="middle" class="body"><tspan x="915" dy="0">held 保留原预占</tspan><tspan x="915" dy="23">不自动回收</tspan></text>
<path d="M245 975C245 958 875 958 875 975V1064C875 1081 245 1081 245 1064Z" fill="#e5f0e9" stroke="#b8cbd7"/><ellipse cx="560" cy="975" rx="315" ry="13" fill="#e5f0e9" stroke="#b8cbd7"/>
<text x="560" y="1007.5" text-anchor="middle" class="head"><tspan x="560" dy="0">共享预算与后续准入</tspan></text>
<text x="560" y="1037.5" text-anchor="middle" class="body"><tspan x="560" dy="0">committed：实际费用 + 未知预占</tspan><tspan x="560" dy="23">active：held + 特定远端未知占位</tspan></text>
<text x="560" y="912" text-anchor="middle" class="label"><tspan x="560" dy="0">超时、取消、连接中断的未知调用仍可能占 active</tspan></text>
<text x="560" y="1137" text-anchor="middle" class="label"><tspan x="560" dy="0">预算限额与模拟价格不是实际账单　Worker 不叠加模型重试　超预占实际费用完整记录并阻断后续</tspan></text>
</svg>
