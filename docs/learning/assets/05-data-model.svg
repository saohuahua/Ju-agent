<text x="560" y="180.5" text-anchor="middle" class="body"><tspan x="560" dy="0">一条运行记录</tspan></text>
<rect x="55" y="295" width="295" height="90" rx="10" fill="#e5f0e9" stroke="#b8cbd7"/>
<text x="202.5" y="322" text-anchor="middle" class="head"><tspan x="202.5" dy="0">agent_events</tspan></text>
<text x="202.5" y="352" text-anchor="middle" class="body"><tspan x="202.5" dy="0">运行内 sequence</tspan><tspan x="202.5" dy="23">消息与客户事件</tspan></text>
<rect x="405" y="295" width="310" height="90" rx="10" fill="#e8eff5" stroke="#b8cbd7"/>
<text x="560" y="322" text-anchor="middle" class="head"><tspan x="560" dy="0">p6_commands</tspan></text>
<text x="560" y="352" text-anchor="middle" class="body"><tspan x="560" dy="0">客户与请求键唯一</tspan><tspan x="560" dy="23">原输入与冻结配置</tspan></text>
<rect x="770" y="295" width="295" height="90" rx="10" fill="#e8eff5" stroke="#b8cbd7"/>
<text x="917.5" y="322" text-anchor="middle" class="head"><tspan x="917.5" dy="0">p6_conversation_refunds</tspan></text>
<text x="917.5" y="352" text-anchor="middle" class="body"><tspan x="917.5" dy="0">原工具与售后关联</tspan><tspan x="917.5" dy="23">每个运行至多一条</tspan></text>
<rect x="405" y="500" width="310" height="88" rx="10" fill="#e8eff5" stroke="#b8cbd7"/>
<text x="560" y="526" text-anchor="middle" class="head"><tspan x="560" dy="0">p6_tasks</tspan></text>
<text x="560" y="556" text-anchor="middle" class="body"><tspan x="560" dy="0">每个命令对应一个任务</tspan><tspan x="560" dy="23">状态 · owner · generation</tspan></text>
<rect x="770" y="500" width="295" height="88" rx="10" fill="#e8eff5" stroke="#b8cbd7"/>
<text x="917.5" y="537.5" text-anchor="middle" class="head"><tspan x="917.5" dy="0">return_requests</tspan></text>
<text x="917.5" y="567.5" text-anchor="middle" class="body"><tspan x="917.5" dy="0">原售后状态与政策</tspan></text>
<rect x="55" y="705" width="295" height="90" rx="10" fill="#e8eff5" stroke="#b8cbd7"/>
<text x="202.5" y="732" text-anchor="middle" class="head"><tspan x="202.5" dy="0">p6_steps / p6_events</tspan></text>
<text x="202.5" y="762" text-anchor="middle" class="body"><tspan x="202.5" dy="0">任务步骤与确认事件</tspan><tspan x="202.5" dy="23">分别具有唯一约束</tspan></text>
<rect x="405" y="705" width="310" height="90" rx="10" fill="#e8eff5" stroke="#b8cbd7"/>
<text x="560" y="732" text-anchor="middle" class="head"><tspan x="560" dy="0">p6_effects</tspan></text>
<text x="560" y="762" text-anchor="middle" class="body"><tspan x="560" dy="0">业务键唯一</tspan><tspan x="560" dy="23">发送意图与确认结果</tspan></text>
<rect x="770" y="705" width="295" height="90" rx="10" fill="#e8eff5" stroke="#b8cbd7"/>
<text x="917.5" y="732" text-anchor="middle" class="head"><tspan x="917.5" dy="0">refunds</tspan></text>
<text x="917.5" y="762" text-anchor="middle" class="body"><tspan x="917.5" dy="0">return_no 唯一</tspan><tspan x="917.5" dy="23">同一售后至多一条退款</tspan></text>
<path d="M220 930C220 913 520 913 520 930V989C520 1006 220 1006 220 989Z" fill="#e5f0e9" stroke="#b8cbd7"/><ellipse cx="370" cy="930" rx="150" ry="13" fill="#e5f0e9" stroke="#b8cbd7"/>
<text x="370" y="959" text-anchor="middle" class="head"><tspan x="370" dy="0">execution_ownership</tspan></text>
<text x="370" y="989" text-anchor="middle" class="body"><tspan x="370" dy="0">业务键 → 执行路径与许可</tspan></text>
<path d="M620 930C620 913 920 913 920 930V989C920 1006 620 1006 620 989Z" fill="#e5f0e9" stroke="#b8cbd7"/><ellipse cx="770" cy="930" rx="150" ry="13" fill="#e5f0e9" stroke="#b8cbd7"/>
<text x="770" y="959" text-anchor="middle" class="head"><tspan x="770" dy="0">渠道 SQLite</tspan></text>
<text x="770" y="989" text-anchor="middle" class="body"><tspan x="770" dy="0">业务键 → 独立交易结果</tspan></text>
<text x="560" y="1037" text-anchor="middle" class="label"><tspan x="560" dy="0">关联存在不代表已执行　会话、任务、售后与资金状态不可替代　两库备份需协调一致</tspan></text>
</svg>
