<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="1110" viewBox="0 0 1120 1110" role="img" aria-labelledby="title desc"><title id="title">工具与安全：行为提示之外的执行边界</title><desc id="desc">动态目录和版本目录分别标注　越权输出仍必须经过宿主授权与业务校验</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L7 4L0 8" fill="#52758a"/></marker><style>text{font-family:'Microsoft YaHei','Noto Sans SC',sans-serif;fill:#253b49}.title{font-size:25px;font-weight:700}.subtitle{font-size:16px;fill:#607581}.head{font-size:19px;font-weight:700}.body{font-size:16px}.label{font-size:14px;fill:#405e70}.group{font-size:16px;font-weight:700;fill:#4c6b7d}</style></defs><rect width="1120" height="1110" fill="#f8fafb" rx="16"/>
<text x="560" y="43" text-anchor="middle" class="title"><tspan x="560" dy="0">工具与安全：行为提示之外的执行边界</tspan></text>
<text x="560" y="74" text-anchor="middle" class="subtitle"><tspan x="560" dy="0">动态目录和版本目录分别标注　越权输出仍必须经过宿主授权与业务校验</tspan></text>
<path d="M270 220V260H560V300" fill="none" stroke="#52758a" stroke-width="1.8"  marker-end="url(#arrow)"/>
<path d="M850 220V260H560" fill="none" stroke="#52758a" stroke-width="1.8"  marker-end="url(#arrow)"/>
<path d="M560 390V470" fill="none" stroke="#52758a" stroke-width="1.8"  marker-end="url(#arrow)"/>
<path d="M560 555V625" fill="none" stroke="#52758a" stroke-width="1.8"  marker-end="url(#arrow)"/>
<path d="M560 710V780" fill="none" stroke="#52758a" stroke-width="1.8"  marker-end="url(#arrow)"/>
<path d="M560 865V916H275V955" fill="none" stroke="#52758a" stroke-width="1.8"  marker-end="url(#arrow)"/>
<path d="M560 916H845V955" fill="none" stroke="#52758a" stroke-width="1.8"  marker-end="url(#arrow)"/>
<path d="M770 512H1080V1000H1055" fill="none" stroke="#52758a" stroke-width="1.8"  marker-end="url(#arrow)"/>
<rect x="963" y="494" width="70" height="23" rx="4" fill="#f8fafb"/>
<text x="998" y="510" text-anchor="middle" class="label"><tspan x="998" dy="0">非法输入</tspan></text>
<path d="M770 667H1080" fill="none" stroke="#52758a" stroke-width="1.8"  marker-end="url(#arrow)"/>
<rect x="910" y="639" width="112" height="23" rx="4" fill="#f8fafb"/>
<text x="966" y="655" text-anchor="middle" class="label"><tspan x="966" dy="0">越权或业务冲突</tspan></text>
<rect x="70" y="125" width="400" height="95" rx="10" fill="#e8eff5" stroke="#b8cbd7"/>
<text x="270" y="154.5" text-anchor="middle" class="head"><tspan x="270" dy="0">旧 AgentRunner</tspan></text>
<text x="270" y="184.5" text-anchor="middle" class="body"><tspan x="270" dy="0">查单成功后开放动作工具</tspan><tspan x="270" dy="23">escalate 保留为例外</tspan></text>
<rect x="650" y="125" width="400" height="95" rx="10" fill="#e8eff5" stroke="#b8cbd7"/>
<text x="850" y="154.5" text-anchor="middle" class="head"><tspan x="850" dy="0">当前 DurableConversation</tspan></text>
<text x="850" y="184.5" text-anchor="middle" class="body"><tspan x="850" dy="0">按冻结 toolVersion 限定集合</tspan><tspan x="850" dy="23">未逐轮复用旧动态查单门控</tspan></text>
<rect x="350" y="300" width="420" height="90" rx="10" fill="#e8eff5" stroke="#b8cbd7"/>
<text x="560" y="338.5" text-anchor="middle" class="head"><tspan x="560" dy="0">模型返回工具调用</tspan></text>
<text x="560" y="368.5" text-anchor="middle" class="body"><tspan x="560" dy="0">提示词引导行为，但不授予权限</tspan></text>
<rect x="350" y="470" width="420" height="85" rx="10" fill="#e8eff5" stroke="#b8cbd7"/>
<text x="560" y="506" text-anchor="middle" class="head"><tspan x="560" dy="0">工具白名单与 Schema</tspan></text>
<text x="560" y="536" text-anchor="middle" class="body"><tspan x="560" dy="0">拒绝未知工具及不合法结构</tspan></text>
<rect x="350" y="625" width="420" height="85" rx="10" fill="#e8eff5" stroke="#b8cbd7"/>
<text x="560" y="661" text-anchor="middle" class="head"><tspan x="560" dy="0">身份、资源与原方案核验</tspan></text>
<text x="560" y="691" text-anchor="middle" class="body"><tspan x="560" dy="0">客户归属 · 政策 · 金额 · 审批</tspan></text>
<rect x="350" y="780" width="420" height="85" rx="10" fill="#e8eff5" stroke="#b8cbd7"/>
<text x="560" y="816" text-anchor="middle" class="head"><tspan x="560" dy="0">执行权与持久资金协议</tspan></text>
<text x="560" y="846" text-anchor="middle" class="body"><tspan x="560" dy="0">唯一许可 · 原业务键 · 未知核验</tspan></text>
<rect x="65" y="955" width="420" height="90" rx="10" fill="#e5f0e9" stroke="#b8cbd7"/>
<text x="275" y="993.5" text-anchor="middle" class="head"><tspan x="275" dy="0">客户白名单投影</tspan></text>
<text x="275" y="1023.5" text-anchor="middle" class="body"><tspan x="275" dy="0">只公开允许事件与字段</tspan></text>
<rect x="635" y="955" width="420" height="90" rx="10" fill="#fff2d8" stroke="#b8cbd7"/>
<text x="845" y="993.5" text-anchor="middle" class="head"><tspan x="845" dy="0">明确拒绝或保留未知</tspan></text>
<text x="845" y="1023.5" text-anchor="middle" class="body"><tspan x="845" dy="0">不通过删除记录绕过约束</tspan></text>
<text x="176" y="512" text-anchor="middle" class="label"><tspan x="176" dy="0">目录不可见</tspan><tspan x="176" dy="24">不替代执行校验</tspan></text>
<text x="176" y="674" text-anchor="middle" class="label"><tspan x="176" dy="0">客户自称主管</tspan><tspan x="176" dy="24">不改变真实身份</tspan></text>
<text x="560" y="1087" text-anchor="middle" class="label"><tspan x="560" dy="0">模型拒绝与系统拦截分别评测　脱敏不能替代归属检查　提示词更新不等于安全质量已验证</tspan></text>
</svg>
