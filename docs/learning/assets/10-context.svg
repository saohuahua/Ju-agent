<text x="215" y="846" text-anchor="middle" class="body"><tspan x="215" dy="0">由已知事件确定性归约</tspan><tspan x="215" dy="23">当前订单与动作</tspan></text>
<rect x="415" y="771" width="290" height="126" rx="10" fill="#e8eff5" stroke="#b8cbd7"/>
<text x="560" y="816" text-anchor="middle" class="head"><tspan x="560" dy="0">长度估算与清理</tspan></text>
<text x="560" y="846" text-anchor="middle" class="body"><tspan x="560" dy="0">可选预算，超限清理</tspan><tspan x="560" dy="23">保留最近四个完整结果</tspan></text>
<rect x="760" y="771" width="290" height="126" rx="10" fill="#e8eff5" stroke="#b8cbd7"/>
<text x="905" y="816" text-anchor="middle" class="head"><tspan x="905" dy="0">原始事件仍保留</tspan></text>
<text x="905" y="846" text-anchor="middle" class="body"><tspan x="905" dy="0">占位不等于事实摘要</tspan><tspan x="905" dy="23">未自动提供按需回读</tspan></text>
<text x="820" y="588" text-anchor="middle" class="label"><tspan x="820" dy="0">消息重排不改写原审计时间</tspan></text>
<text x="560" y="1047" text-anchor="middle" class="label"><tspan x="560" dy="0">当前持久会话直接重建消息　保存历史、协议重建、压缩与长期记忆不能混称</tspan></text>
