<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="885" viewBox="0 0 1120 885" role="img" aria-labelledby="title desc"><title id="title">人工求助与本案结案</title><desc id="desc">关联沟通不转移原资金执行权　结案预览不等于提交授权</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L7 4L0 8" fill="#52758a"/></marker><style>text{font-family:'Microsoft YaHei','Noto Sans SC',sans-serif;fill:#253b49}.title{font-size:25px;font-weight:700}.subtitle{font-size:16px;fill:#607581}.head{font-size:19px;font-weight:700}.body{font-size:16px}.label{font-size:14px;fill:#405e70}.group{font-size:16px;font-weight:700;fill:#4c6b7d}</style></defs><rect width="1120" height="885" fill="#f8fafb" rx="16"/>
<text x="560" y="43" text-anchor="middle" class="title"><tspan x="560" dy="0">人工求助与本案结案</tspan></text>
<text x="560" y="74" text-anchor="middle" class="subtitle"><tspan x="560" dy="0">关联沟通不转移原资金执行权　结案预览不等于提交授权</tspan></text>
<path d="M340 175H435" fill="none" stroke="#52758a" stroke-width="1.8"  marker-end="url(#arrow)"/>
<rect x="360" y="141" width="56" height="23" rx="4" fill="#f8fafb"/>
<text x="388" y="157" text-anchor="middle" class="label"><tspan x="388" dy="0">可复用</tspan></text>
<path d="M200 125V95H938V125" fill="none" stroke="#52758a" stroke-width="1.8"  marker-end="url(#arrow)"/>
<rect x="701" y="75" width="112" height="23" rx="4" fill="#f8fafb"/>
<text x="757" y="91" text-anchor="middle" class="label"><tspan x="757" dy="0">不覆盖来源业务</tspan></text>
<path d="M575 225V320" fill="none" stroke="#52758a" stroke-width="1.8"  marker-end="url(#arrow)"/>
<path d="M938 225V275H575V320" fill="none" stroke="#52758a" stroke-width="1.8"  marker-end="url(#arrow)"/>
<path d="M938 225V320" fill="none" stroke="#52758a" stroke-width="1.8"  marker-end="url(#arrow)"/>
<path d="M575 420V463H215V510" fill="none" stroke="#52758a" stroke-width="1.8"  marker-end="url(#arrow)"/>
<rect x="326" y="436" width="70" height="23" rx="4" fill="#f8fafb"/>
<text x="361" y="452" text-anchor="middle" class="label"><tspan x="361" dy="0">处理本案</tspan></text>
<path d="M365 567H435" fill="none" stroke="#52758a" stroke-width="1.8"  marker-end="url(#arrow)"/>
<path d="M720 567H805" fill="none" stroke="#52758a" stroke-width="1.8"  marker-end="url(#arrow)"/>
<rect x="734" y="532" width="56" height="23" rx="4" fill="#f8fafb"/>
<text x="762" y="548" text-anchor="middle" class="label"><tspan x="762" dy="0">有阻塞</tspan></text>
<path d="M575 625V725" fill="none" stroke="#52758a" stroke-width="1.8"  marker-end="url(#arrow)"/>
<rect x="505" y="661" width="140" height="23" rx="4" fill="#f8fafb"/>
<text x="575" y="677" text-anchor="middle" class="label"><tspan x="575" dy="0">无阻塞仍须事务重查</tspan></text>
<rect x="60" y="125" width="280" height="100" rx="10" fill="#e8eff5" stroke="#b8cbd7"/>
<text x="200" y="157" text-anchor="middle" class="head"><tspan x="200" dy="0">客户请求人工</tspan></text>
<text x="200" y="187" text-anchor="middle" class="body"><tspan x="200" dy="0">校验来源运行归属</tspan><tspan x="200" dy="23">无需模型调用</tspan></text>
<rect x="435" y="125" width="285" height="100" rx="10" fill="#e5f1e9" stroke="#b8cbd7"/>
<text x="577.5" y="157" text-anchor="middle" class="head"><tspan x="577.5" dy="0">空闲且无业务占用</tspan></text>
<text x="577.5" y="187" text-anchor="middle" class="body"><tspan x="577.5" dy="0">满足复用条件</tspan><tspan x="577.5" dy="23">原会话转人工</tspan></text>
<rect x="805" y="125" width="265" height="100" rx="10" fill="#fff1d6" stroke="#b8cbd7"/>
<text x="937.5" y="157" text-anchor="middle" class="head"><tspan x="937.5" dy="0">忙碌或已有退款</tspan></text>
<text x="937.5" y="187" text-anchor="middle" class="body"><tspan x="937.5" dy="0">另开或复用关联人工</tspan><tspan x="937.5" dy="23">原任务保持原状</tspan></text>
<rect x="435" y="320" width="285" height="100" rx="10" fill="#e8eff5" stroke="#b8cbd7"/>
<text x="577.5" y="352" text-anchor="middle" class="head"><tspan x="577.5" dy="0">操作员或主管接管</tspan></text>
<text x="577.5" y="382" text-anchor="middle" class="body"><tspan x="577.5" dy="0">escalated</tspan><tspan x="577.5" dy="23">进入 handling_human</tspan></text>
<rect x="805" y="320" width="265" height="100" rx="10" fill="#f8e6e2" stroke="#b8cbd7"/>
<text x="937.5" y="352" text-anchor="middle" class="head"><tspan x="937.5" dy="0">来源关联限制</tspan></text>
<text x="937.5" y="382" text-anchor="middle" class="body"><tspan x="937.5" dy="0">sourceRunId 仅为线索</tspan><tspan x="937.5" dy="23">结案不自动递归原退款</tspan></text>
<rect x="65" y="510" width="300" height="115" rx="10" fill="#e8eff5" stroke="#b8cbd7"/>
<text x="215" y="549.5" text-anchor="middle" class="head"><tspan x="215" dy="0">收集本案可信关联</tspan></text>
<text x="215" y="579.5" text-anchor="middle" class="body"><tspan x="215" dy="0">审计 审批 检查点 任务</tspan><tspan x="215" dy="23">核验资源存在与归属</tspan></text>
<rect x="435" y="510" width="285" height="115" rx="10" fill="#e8eff5" stroke="#b8cbd7"/>
<text x="577.5" y="549.5" text-anchor="middle" class="head"><tspan x="577.5" dy="0">逐资源终态核验</tspan></text>
<text x="577.5" y="579.5" text-anchor="middle" class="body"><tspan x="577.5" dy="0">退款 售后 任务 资金效果</tspan><tspan x="577.5" dy="23">缺失与未知均阻塞</tspan></text>
<rect x="805" y="510" width="265" height="115" rx="10" fill="#fff1d6" stroke="#b8cbd7"/>
<text x="937.5" y="549.5" text-anchor="middle" class="head"><tspan x="937.5" dy="0">存在阻塞</tspan></text>
<text x="937.5" y="579.5" text-anchor="middle" class="body"><tspan x="937.5" dy="0">返回原因 保留案件</tspan><tspan x="937.5" dy="23">沿原业务合法处理</tspan></text>
<rect x="245" y="725" width="635" height="95" rx="10" fill="#e5f1e9" stroke="#b8cbd7"/>
<text x="562.5" y="766" text-anchor="middle" class="head"><tspan x="562.5" dy="0">提交时重新核验并共同写入</tspan></text>
<text x="562.5" y="796" text-anchor="middle" class="body"><tspan x="562.5" dy="0">handling_human 且无阻塞 → 会话完成 客户事件 内部审计</tspan></text>
<text x="560" y="862" text-anchor="middle" class="label"><tspan x="560" dy="0">新人工案件结案不能证明来源退款成功　禁止直接改状态消除未知资金</tspan></text>
</svg>
