<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="710" viewBox="0 0 1120 710" role="img" aria-labelledby="title desc"><title id="title">补偿 价保与换货的业务差异</title><desc id="desc">共用部分基础设施不意味着共用金额规则和完成语义</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L7 4L0 8" fill="#52758a"/></marker><style>text{font-family:'Microsoft YaHei','Noto Sans SC',sans-serif;fill:#253b49}.title{font-size:25px;font-weight:700}.subtitle{font-size:16px;fill:#607581}.head{font-size:19px;font-weight:700}.body{font-size:16px}.label{font-size:14px;fill:#405e70}.group{font-size:16px;font-weight:700;fill:#4c6b7d}</style></defs><rect width="1120" height="710" fill="#f8fafb" rx="16"/>
<text x="560" y="43" text-anchor="middle" class="title"><tspan x="560" dy="0">补偿 价保与换货的业务差异</tspan></text>
<text x="560" y="74" text-anchor="middle" class="subtitle"><tspan x="560" dy="0">共用部分基础设施不意味着共用金额规则和完成语义</tspan></text>
<path d="M200 260V355" fill="none" stroke="#52758a" stroke-width="1.8"  marker-end="url(#arrow)"/>
<rect x="144" y="291" width="112" height="23" rx="4" fill="#f8fafb"/>
<text x="200" y="307" text-anchor="middle" class="label"><tspan x="200" dy="0">资格与占位核验</tspan></text>
<path d="M560 260V355" fill="none" stroke="#52758a" stroke-width="1.8"  marker-end="url(#arrow)"/>
<rect x="504" y="291" width="112" height="23" rx="4" fill="#f8fafb"/>
<text x="560" y="307" text-anchor="middle" class="label"><tspan x="560" dy="0">明细与金额快照</tspan></text>
<path d="M920 260V355" fill="none" stroke="#52758a" stroke-width="1.8"  marker-end="url(#arrow)"/>
<rect x="857" y="291" width="126" height="23" rx="4" fill="#f8fafb"/>
<text x="920" y="307" text-anchor="middle" class="label"><tspan x="920" dy="0">寄回后操作员收货</tspan></text>
<rect x="50" y="140" width="300" height="120" rx="10" fill="#e8eff5" stroke="#b8cbd7"/>
<text x="200" y="182" text-anchor="middle" class="head"><tspan x="200" dy="0">补偿输入</tspan></text>
<text x="200" y="212" text-anchor="middle" class="body"><tspan x="200" dy="0">订单 原因 协商金额</tspan><tspan x="200" dy="23">同订单同原因占位</tspan></text>
<rect x="410" y="140" width="300" height="120" rx="10" fill="#e8eff5" stroke="#b8cbd7"/>
<text x="560" y="182" text-anchor="middle" class="head"><tspan x="560" dy="0">价保输入</tspan></text>
<text x="560" y="212" text-anchor="middle" class="body"><tspan x="560" dy="0">成交价 当前价 数量</tspan><tspan x="560" dy="23">签收窗口与活跃售后</tspan></text>
<rect x="770" y="140" width="300" height="120" rx="10" fill="#e8eff5" stroke="#b8cbd7"/>
<text x="920" y="182" text-anchor="middle" class="head"><tspan x="920" dy="0">换货输入</tspan></text>
<text x="920" y="212" text-anchor="middle" class="body"><tspan x="920" dy="0">原售后类型 exchange</tspan><tspan x="920" dy="23">政策与寄回授权</tspan></text>
<rect x="50" y="355" width="300" height="125" rx="10" fill="#e5f1e9" stroke="#b8cbd7"/>
<text x="200" y="399.5" text-anchor="middle" class="head"><tspan x="200" dy="0">补偿分级与发放</tspan></text>
<text x="200" y="429.5" text-anchor="middle" class="body"><tspan x="200" dy="0">不超过 50 元可自动</tspan><tspan x="200" dy="23">超过需审批 原业务键</tspan></text>
<rect x="410" y="355" width="300" height="125" rx="10" fill="#e5f1e9" stroke="#b8cbd7"/>
<text x="560" y="399.5" text-anchor="middle" class="head"><tspan x="560" dy="0">价保计算与退还</tspan></text>
<text x="560" y="429.5" text-anchor="middle" class="body"><tspan x="560" dy="0">仅降价商品 差价乘数量</tspan><tspan x="560" dy="23">达到 5000 元需审批</tspan></text>
<rect x="770" y="355" width="300" height="125" rx="10" fill="#fff1d6" stroke="#b8cbd7"/>
<text x="920" y="399.5" text-anchor="middle" class="head"><tspan x="920" dy="0">换货收货后留痕</tspan></text>
<text x="920" y="429.5" text-anchor="middle" class="body"><tspan x="920" dy="0">不创建退款</tspan><tspan x="920" dy="23">未实现库存和补发闭环</tspan></text>
<rect x="145" y="565" width="830" height="85" rx="10" fill="#f8e6e2" stroke="#b8cbd7"/>
<text x="560" y="601" text-anchor="middle" class="head"><tspan x="560" dy="0">入口边界</tspan></text>
<text x="560" y="631" text-anchor="middle" class="body"><tspan x="560" dy="0">默认持久客户受理只开放仅退款与退货　其他服务与已有任务映射需单独核实</tspan></text>
<text x="560" y="687" text-anchor="middle" class="label"><tspan x="560" dy="0">局部服务测试不等于当前客户端到端闭环　兼容重试不覆盖持久资金未知</tspan></text>
</svg>
