<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="1030" viewBox="0 0 1120 1030" role="img" aria-labelledby="title desc"><title id="title">Agent 与工作流：动态取证，受控执行</title><desc id="desc">左侧选择下一步信息行动　右侧依据业务事实形成并执行授权方案</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L7 4L0 8" fill="#52758a"/></marker><style>text{font-family:'Microsoft YaHei','Noto Sans SC',sans-serif;fill:#253b49}.title{font-size:25px;font-weight:700}.subtitle{font-size:16px;fill:#607581}.head{font-size:19px;font-weight:700}.body{font-size:16px}.label{font-size:14px;fill:#405e70}.group{font-size:16px;font-weight:700;fill:#4c6b7d}</style></defs><rect width="1120" height="1030" fill="#f8fafb" rx="16"/>
<text x="560" y="43" text-anchor="middle" class="title"><tspan x="560" dy="0">Agent 与工作流：动态取证，受控执行</tspan></text>
<text x="560" y="74" text-anchor="middle" class="subtitle"><tspan x="560" dy="0">左侧选择下一步信息行动　右侧依据业务事实形成并执行授权方案</tspan></text>
<rect x="35" y="110" width="475" height="720" rx="14" fill="#f0f4f7" stroke="#cfdae1"/>
<text x="272.5" y="137" text-anchor="middle" class="group"><tspan x="272.5" dy="0">会话 Worker：动态信息循环</tspan></text>
<rect x="610" y="110" width="475" height="720" rx="14" fill="#f0f4f7" stroke="#cfdae1"/>
<text x="847.5" y="137" text-anchor="middle" class="group"><tspan x="847.5" dy="0">业务链路：确定性约束</tspan></text>
<path d="M272 265V340" fill="none" stroke="#52758a" stroke-width="1.8"  marker-end="url(#arrow)"/>
<path d="M272 435V535" fill="none" stroke="#52758a" stroke-width="1.8"  marker-end="url(#arrow)"/>
<rect x="286" y="468" width="70" height="23" rx="4" fill="#f8fafb"/>
<text x="321" y="484" text-anchor="middle" class="label"><tspan x="321" dy="0">工具调用</tspan></text>
<path d="M100 585H68V388H100" fill="none" stroke="#52758a" stroke-width="1.8" stroke-dasharray="6 5" marker-end="url(#arrow)"/>
<rect x="34" y="486" width="98" height="23" rx="4" fill="#f8fafb"/>
<text x="83" y="502" text-anchor="middle" class="label"><tspan x="83" dy="0">观察后再选择</tspan></text>
<path d="M445 387H675" fill="none" stroke="#52758a" stroke-width="1.8"  marker-end="url(#arrow)"/>
<rect x="475" y="360" width="168" height="23" rx="4" fill="#f8fafb"/>
<text x="559" y="376" text-anchor="middle" class="label"><tspan x="559" dy="0">申请意图，不传可信金额</tspan></text>
<path d="M847 440V535" fill="none" stroke="#52758a" stroke-width="1.8"  marker-end="url(#arrow)"/>
<path d="M847 635V700" fill="none" stroke="#52758a" stroke-width="1.8"  marker-end="url(#arrow)"/>
<path d="M847 800V855H335V896" fill="none" stroke="#52758a" stroke-width="1.8"  marker-end="url(#arrow)"/>
<rect x="546" y="835" width="70" height="23" rx="4" fill="#f8fafb"/>
<text x="581" y="851" text-anchor="middle" class="label"><tspan x="581" dy="0">确认结果</tspan></text>
<path d="M847 855H805V896" fill="none" stroke="#52758a" stroke-width="1.8"  marker-end="url(#arrow)"/>
<rect x="872" y="865" width="56" height="23" rx="4" fill="#f8fafb"/>
<text x="900" y="881" text-anchor="middle" class="label"><tspan x="900" dy="0">未确认</tspan></text>
<path d="M335 896V833H272V635" fill="none" stroke="#52758a" stroke-width="1.8" stroke-dasharray="6 5" marker-end="url(#arrow)"/>
<rect x="229" y="770" width="84" height="23" rx="4" fill="#f8fafb"/>
<text x="271" y="786" text-anchor="middle" class="label"><tspan x="271" dy="0">回填原关联</tspan></text>
<rect x="100" y="175" width="345" height="90" rx="10" fill="#e8eff5" stroke="#b8cbd7"/>
<text x="272.5" y="213.5" text-anchor="middle" class="head"><tspan x="272.5" dy="0">用户消息与历史</tspan></text>
<text x="272.5" y="243.5" text-anchor="middle" class="body"><tspan x="272.5" dy="0">冻结配置 · 原运行身份</tspan></text>
<rect x="100" y="340" width="345" height="95" rx="10" fill="#e8eff5" stroke="#b8cbd7"/>
<text x="272.5" y="369.5" text-anchor="middle" class="head"><tspan x="272.5" dy="0">模型选择下一步</tspan></text>
<text x="272.5" y="399.5" text-anchor="middle" class="body"><tspan x="272.5" dy="0">查询订单 / 物流 / 政策</tspan><tspan x="272.5" dy="23">缺信息时 ask_user</tspan></text>
<rect x="100" y="535" width="345" height="100" rx="10" fill="#e8eff5" stroke="#b8cbd7"/>
<text x="272.5" y="567" text-anchor="middle" class="head"><tspan x="272.5" dy="0">宿主执行受控工具</tspan></text>
<text x="272.5" y="597" text-anchor="middle" class="body"><tspan x="272.5" dy="0">名字、参数与归属</tspan><tspan x="272.5" dy="23">结果回填原 toolCallId</tspan></text>
<rect x="675" y="340" width="345" height="100" rx="10" fill="#e8eff5" stroke="#b8cbd7"/>
<text x="847.5" y="372" text-anchor="middle" class="head"><tspan x="847.5" dy="0">领域方案准备</tspan></text>
<text x="847.5" y="402" text-anchor="middle" class="body"><tspan x="847.5" dy="0">重查事实、金额与资格</tspan><tspan x="847.5" dy="23">拒绝模型授权字段</tspan></text>
<rect x="675" y="535" width="345" height="100" rx="10" fill="#e8eff5" stroke="#b8cbd7"/>
<text x="847.5" y="567" text-anchor="middle" class="head"><tspan x="847.5" dy="0">批准与持久受理</tspan></text>
<text x="847.5" y="597" text-anchor="middle" class="body"><tspan x="847.5" dy="0">自动或人工批准</tspan><tspan x="847.5" dy="23">退货需满足收货条件</tspan></text>
<rect x="675" y="700" width="345" height="100" rx="10" fill="#e8eff5" stroke="#b8cbd7"/>
<text x="847.5" y="743.5" text-anchor="middle" class="head"><tspan x="847.5" dy="0">资金 Worker</tspan></text>
<text x="847.5" y="773.5" text-anchor="middle" class="body"><tspan x="847.5" dy="0">许可 → 意图 → 渠道核验</tspan></text>
<rect x="170" y="896" width="330" height="80" rx="10" fill="#e5f0e9" stroke="#b8cbd7"/>
<text x="335" y="929.5" text-anchor="middle" class="head"><tspan x="335" dy="0">原工具与客户事件</tspan></text>
<text x="335" y="959.5" text-anchor="middle" class="body"><tspan x="335" dy="0">只投影已确认业务结果</tspan></text>
<rect x="640" y="896" width="330" height="80" rx="10" fill="#fff2d8" stroke="#b8cbd7"/>
<text x="805" y="929.5" text-anchor="middle" class="head"><tspan x="805" dy="0">未知结果</tspan></text>
<text x="805" y="959.5" text-anchor="middle" class="body"><tspan x="805" dy="0">保留许可并暂停核验</tspan></text>
<text x="560" y="1007" text-anchor="middle" class="label"><tspan x="560" dy="0">模型提出动作不代表授权　资金执行不重新请求模型规划金额　模型、规则与执行错误分别定位</tspan></text>
</svg>
