<rect x="525" y="859" width="70" height="23" rx="4" fill="#f8fafb"/>
<text x="560" y="875" text-anchor="middle" class="label"><tspan x="560" dy="0">核验归档</tspan></text>
<rect x="290" y="120" width="540" height="95" rx="10" fill="#e8eff5" stroke="#b8cbd7"/>
<text x="560" y="161" text-anchor="middle" class="head"><tspan x="560" dy="0">冻结实验条件</tspan></text>
<text x="560" y="191" text-anchor="middle" class="body"><tspan x="560" dy="0">题集与夹具 · 政策 · 模型配置 · Prompt · 源码身份</tspan></text>
<rect x="40" y="295" width="310" height="120" rx="10" fill="#e8eff5" stroke="#b8cbd7"/>
<text x="195" y="337" text-anchor="middle" class="head"><tspan x="195" dy="0">单元／集成与进程实验</tspan></text>
<text x="195" y="367" text-anchor="middle" class="body"><tspan x="195" dy="0">规则与事务性质</tspan><tspan x="195" dy="23">命名退出点与恢复计数</tspan></text>
<rect x="405" y="295" width="310" height="120" rx="10" fill="#e8eff5" stroke="#b8cbd7"/>
<text x="560" y="337" text-anchor="middle" class="head"><tspan x="560" dy="0">L1 脚本化轨迹</tspan></text>
<text x="560" y="367" text-anchor="middle" class="body"><tspan x="560" dy="0">固定模型行为与业务断言</tspan><tspan x="560" dy="23">124 条用例单独统计</tspan></text>
<rect x="770" y="295" width="310" height="120" rx="10" fill="#e8eff5" stroke="#b8cbd7"/>
<text x="925" y="337" text-anchor="middle" class="head"><tspan x="925" dy="0">L2 多轮用户模拟</tspan></text>
<text x="925" y="367" text-anchor="middle" class="body"><tspan x="925" dy="0">Agent 与用户逐轮交互</tspan><tspan x="925" dy="23">保留模拟器和服务失败</tspan></text>
<rect x="40" y="500" width="310" height="125" rx="10" fill="#e5f2ec" stroke="#b8cbd7"/>
<text x="195" y="544.5" text-anchor="middle" class="head"><tspan x="195" dy="0">机制与故障断言</tspan></text>
<text x="195" y="574.5" text-anchor="middle" class="body"><tspan x="195" dy="0">事务 · 权限 · 进程恢复</tspan><tspan x="195" dy="23">针对明确性质作检查</tspan></text>
<rect x="405" y="500" width="310" height="125" rx="10" fill="#e5f2ec" stroke="#b8cbd7"/>
<text x="560" y="544.5" text-anchor="middle" class="head"><tspan x="560" dy="0">业务与轨迹断言</tspan></text>
<text x="560" y="574.5" text-anchor="middle" class="body"><tspan x="560" dy="0">脚本动作后的真实状态</tspan><tspan x="560" dy="23">成功与拒绝均按用例核验</tspan></text>
<rect x="770" y="500" width="310" height="125" rx="10" fill="#fff2d8" stroke="#b8cbd7"/>
<text x="925" y="544.5" text-anchor="middle" class="head"><tspan x="925" dy="0">客观结果与 Judge</tspan></text>
<text x="925" y="574.5" text-anchor="middle" class="body"><tspan x="925" dy="0">业务事实与主观判据分开</tspan><tspan x="925" dy="23">真实人工校准尚未完成</tspan></text>
<path d="M285 728C285 711 835 711 835 728V822C835 839 285 839 285 822Z" fill="#e5f2ec" stroke="#b8cbd7"/><ellipse cx="560" cy="728" rx="275" ry="13" fill="#e5f2ec" stroke="#b8cbd7"/>
<text x="560" y="763" text-anchor="middle" class="head"><tspan x="560" dy="0">可追溯证据包</tspan></text>
<text x="560" y="793" text-anchor="middle" class="body"><tspan x="560" dy="0">逐例结果 · 轮次身份 · 费用 · 失败索引</tspan><tspan x="560" dy="23">内容哈希与来源元数据</tspan></text>
<rect x="285" y="900" width="550" height="80" rx="10" fill="#e8eff5" stroke="#b8cbd7"/>
<text x="560" y="933.5" text-anchor="middle" class="head"><tspan x="560" dy="0">同条件比较</tspan></text>
<text x="560" y="963.5" text-anchor="middle" class="body"><tspan x="560" dy="0">仅放行声明变量　保留失败与原始分母</tspan></text>
<text x="560" y="1007" text-anchor="middle" class="label"><tspan x="560" dy="0">层次之间不合并通过数量　离线协议通过不等于真实模型质量通过</tspan></text>
</svg>
