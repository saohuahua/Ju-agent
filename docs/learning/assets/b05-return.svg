<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="1131" viewBox="0 0 1120 1131" role="img" aria-labelledby="title desc"><title id="title">退货后退款的角色交接</title><desc id="desc">批准 寄回 收货与资金确认分别证明不同事实</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L7 4L0 8" fill="#52758a"/></marker><style>text{font-family:'Microsoft YaHei','Noto Sans SC',sans-serif;fill:#253b49}.title{font-size:25px;font-weight:700}.subtitle{font-size:16px;fill:#607581}.head{font-size:19px;font-weight:700}.body{font-size:16px}.label{font-size:14px;fill:#405e70}.group{font-size:16px;font-weight:700;fill:#4c6b7d}</style></defs><rect width="1120" height="1131" fill="#f8fafb" rx="16"/>
<text x="560" y="43" text-anchor="middle" class="title"><tspan x="560" dy="0">退货后退款的角色交接</tspan></text>
<text x="560" y="74" text-anchor="middle" class="subtitle"><tspan x="560" dy="0">批准 寄回 收货与资金确认分别证明不同事实</tspan></text>
<rect x="25" y="105" width="245" height="961" rx="14" fill="#f3f6f8" stroke="#cfdae1"/>
<text x="147.5" y="132" text-anchor="middle" class="group"><tspan x="147.5" dy="0">客户与页面</tspan></text>
<rect x="300" y="105" width="245" height="961" rx="14" fill="#f0f4f7" stroke="#cfdae1"/>
<text x="422.5" y="132" text-anchor="middle" class="group"><tspan x="422.5" dy="0">会话与业务受理</tspan></text>
<rect x="575" y="105" width="245" height="961" rx="14" fill="#f3f6f8" stroke="#cfdae1"/>
<text x="697.5" y="132" text-anchor="middle" class="group"><tspan x="697.5" dy="0">后台与领域记录</tspan></text>
<rect x="850" y="105" width="245" height="961" rx="14" fill="#f0f4f7" stroke="#cfdae1"/>
<text x="972.5" y="132" text-anchor="middle" class="group"><tspan x="972.5" dy="0">主管或操作员</tspan></text>
<path d="M147.5 235V260H422.5" fill="none" stroke="#52758a" stroke-width="1.8"  marker-end="url(#arrow)"/>
<rect x="264" y="238" width="42" height="23" rx="4" fill="#f8fafb"/>
<text x="285" y="254" text-anchor="middle" class="label"><tspan x="285" dy="0">意图</tspan></text>
<path d="M422.5 368V393H697.5" fill="none" stroke="#52758a" stroke-width="1.8"  marker-end="url(#arrow)"/>
<rect x="532" y="371" width="56" height="23" rx="4" fill="#f8fafb"/>
<text x="560" y="387" text-anchor="middle" class="label"><tspan x="560" dy="0">原方案</tspan></text>
<path d="M972.5 501V526H697.5" fill="none" stroke="#52758a" stroke-width="1.8"  marker-end="url(#arrow)"/>
<rect x="800" y="504" width="70" height="23" rx="4" fill="#f8fafb"/>
<text x="835" y="520" text-anchor="middle" class="label"><tspan x="835" dy="0">有效决定</tspan></text>
<path d="M697.5 634V659H147.5" fill="none" stroke="#52758a" stroke-width="1.8"  marker-end="url(#arrow)"/>
<rect x="373.5" y="637" width="98" height="23" rx="4" fill="#f8fafb"/>
<text x="422.5" y="653" text-anchor="middle" class="label"><tspan x="422.5" dy="0">开放合法寄回</tspan></text>
<path d="M147.5 767V792H422.5" fill="none" stroke="#52758a" stroke-width="1.8"  marker-end="url(#arrow)"/>
<rect x="243" y="770" width="84" height="23" rx="4" fill="#f8fafb"/>
<text x="285" y="786" text-anchor="middle" class="label"><tspan x="285" dy="0">结构化输入</tspan></text>
<path d="M972.5 900V925H697.5" fill="none" stroke="#52758a" stroke-width="1.8"  marker-end="url(#arrow)"/>
<rect x="779" y="903" width="112" height="23" rx="4" fill="#f8fafb"/>
<text x="835" y="919" text-anchor="middle" class="label"><tspan x="835" dy="0">受理原收货任务</tspan></text>
<path d="M697.5 1033V1058H147.5" fill="none" stroke="#52758a" stroke-width="1.8"  marker-end="url(#arrow)"/>
<rect x="387.5" y="1036" width="70" height="23" rx="4" fill="#f8fafb"/>
<text x="422.5" y="1052" text-anchor="middle" class="label"><tspan x="422.5" dy="0">资金结果</tspan></text>
<rect x="35" y="155" width="225" height="80" rx="10" fill="#e8eff5" stroke="#b8cbd7"/>
<text x="147.5" y="188.5" text-anchor="middle" class="head"><tspan x="147.5" dy="0">申请退货</tspan></text>
<text x="147.5" y="218.5" text-anchor="middle" class="body"><tspan x="147.5" dy="0">原订单 原因 商品范围</tspan></text>
<rect x="310" y="288" width="225" height="80" rx="10" fill="#e8eff5" stroke="#b8cbd7"/>
<text x="422.5" y="321.5" text-anchor="middle" class="head"><tspan x="422.5" dy="0">领域允许或等待审批</tspan></text>
<text x="422.5" y="351.5" text-anchor="middle" class="body"><tspan x="422.5" dy="0">预留原退款与关联</tspan></text>
<rect x="860" y="421" width="225" height="80" rx="10" fill="#fff1d6" stroke="#b8cbd7"/>
<text x="972.5" y="454.5" text-anchor="middle" class="head"><tspan x="972.5" dy="0">需要审批时主管决定</tspan></text>
<text x="972.5" y="484.5" text-anchor="middle" class="body"><tspan x="972.5" dy="0">自动路径不经过人工令牌</tspan></text>
<rect x="585" y="554" width="225" height="80" rx="10" fill="#fff1d6" stroke="#b8cbd7"/>
<text x="697.5" y="587.5" text-anchor="middle" class="head"><tspan x="697.5" dy="0">授权等待已保存</tspan></text>
<text x="697.5" y="617.5" text-anchor="middle" class="body"><tspan x="697.5" dy="0">待寄回 尚未退款</tspan></text>
<rect x="35" y="687" width="225" height="80" rx="10" fill="#e8eff5" stroke="#b8cbd7"/>
<text x="147.5" y="720.5" text-anchor="middle" class="head"><tspan x="147.5" dy="0">登记原售后运单</tspan></text>
<text x="147.5" y="750.5" text-anchor="middle" class="body"><tspan x="147.5" dy="0">核验后 buyer_shipped</tspan></text>
<rect x="860" y="820" width="225" height="80" rx="10" fill="#e8eff5" stroke="#b8cbd7"/>
<text x="972.5" y="853.5" text-anchor="middle" class="head"><tspan x="972.5" dy="0">操作员确认收货</tspan></text>
<text x="972.5" y="883.5" text-anchor="middle" class="body"><tspan x="972.5" dy="0">原授权 ready 且未发送</tspan></text>
<rect x="585" y="953" width="225" height="80" rx="10" fill="#e5f1e9" stroke="#b8cbd7"/>
<text x="697.5" y="986.5" text-anchor="middle" class="head"><tspan x="697.5" dy="0">执行原退款并确认</tspan></text>
<text x="697.5" y="1016.5" text-anchor="middle" class="body"><tspan x="697.5" dy="0">成功后完成售后与投影</tspan></text>
<text x="560" y="1108" text-anchor="middle" class="label"><tspan x="560" dy="0">等待任务完成不等于售后完成　收货不创建第二笔退款</tspan></text>
</svg>
