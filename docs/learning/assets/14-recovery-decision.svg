<svg xmlns="http://www.w3.org/2000/svg" width="960" height="830" viewBox="0 0 960 830" role="img" aria-labelledby="title desc">
  <title id="title">恢复时先识别资金意图再决定发送或查询</title>
  <desc id="desc">恢复 Worker 读取业务库 已有成功或拒付则复用终态 已有未确认资金意图则查询原业务键 没有意图才经事务获权决定首次发送 未知或未找到不会自动解锁重发</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#526b7b"/></marker>
    <style>
      text{font-family:'Microsoft YaHei','Noto Sans SC',sans-serif;fill:#263843;font-size:17px}
      .title{font-size:24px;font-weight:700}.muted{font-size:15px;fill:#62717b}.head{font-weight:700}
      .flow{stroke:#526b7b;stroke-width:2;fill:none;marker-end:url(#arrow)}
      .box{fill:#e8eef4;stroke:#c6d3de;stroke-width:1.3}
    </style>
  </defs>
  <rect width="960" height="830" rx="16" fill="#f7f9fa"/>
  <text x="32" y="44" class="title">任务可以继续，资金不能盲目重发</text>
  <text x="32" y="73" class="muted">资金阶段决策图　前提为有效任务认领　省略取消、截止时间与查询异常分支</text>
  <rect x="278" y="98" width="404" height="57" rx="10" class="box"/>
  <text x="480" y="133" text-anchor="middle" class="head">读取业务库中的原资金效果 p6_effects</text>
  <path d="M480 155 V190" class="flow"/>
  <path d="M480 191 L639 247 L480 303 L321 247 Z" fill="#fff" stroke="#b7c8d3" stroke-width="1.5"/>
  <text x="480" y="242" text-anchor="middle">已有确认终态？</text>
  <text x="480" y="266" text-anchor="middle" class="muted">succeeded / rejected</text>
  <path d="M639 247 H751" class="flow"/>
  <text x="688" y="234" class="muted">是</text>
  <rect x="753" y="215" width="171" height="65" rx="9" fill="#e4efe9" stroke="#bad3c6"/>
  <text x="838" y="244" text-anchor="middle">复用原终态</text>
  <text x="838" y="267" text-anchor="middle" class="muted">不再发送</text>
  <path d="M480 303 V339" class="flow"/>
  <text x="494" y="329" class="muted">否</text>
  <path d="M480 341 L639 389 L480 437 L321 389 Z" fill="#fff" stroke="#b7c8d3" stroke-width="1.5"/>
  <text x="480" y="394" text-anchor="middle">已有资金意图？</text>
  <path d="M321 389 H169 V467" class="flow"/>
  <text x="232" y="376" class="muted">否</text>
  <path d="M639 389 H789 V467" class="flow"/>
  <text x="700" y="376" class="muted">是</text>
  <rect x="40" y="470" width="290" height="85" rx="9" class="box"/>
  <text x="185" y="499" text-anchor="middle" class="head">事务内校验、获权并记录意图</text>
  <text x="185" y="526" text-anchor="middle">仅获首次发送许可才 execute</text>
  <rect x="630" y="470" width="290" height="85" rx="9" class="box"/>
  <text x="775" y="499" text-anchor="middle" class="head">按原业务键 query</text>
  <text x="775" y="526" text-anchor="middle">发送异常后也尝试查询</text>
  <path d="M330 513 H630" class="flow"/>
  <text x="389" y="500" class="muted">发送抛出异常</text>
  <path d="M185 555 V587 H480 V611" class="flow"/>
  <path d="M775 555 V587 H480" fill="none" stroke="#526b7b" stroke-width="2"/>
  <text x="70" y="579" class="muted">正常返回</text>
  <text x="799" y="579" class="muted">查询返回</text>
  <rect x="281" y="614" width="398" height="54" rx="9" fill="#fff" stroke="#b7c8d3"/>
  <text x="480" y="648" text-anchor="middle" class="head">按结果确认，不按重试次数猜测</text>
  <path d="M361 668 V692 H234 V719" class="flow"/>
  <text x="73" y="689" class="muted">succeeded / rejected</text>
  <path d="M602 668 V692 H745 V719" class="flow"/>
  <text x="692" y="689" class="muted">unknown / not_found</text>
  <rect x="40" y="722" width="385" height="79" rx="9" fill="#e4efe9" stroke="#bad3c6"/>
  <text x="232" y="753" text-anchor="middle" class="head">事务内回写确认终态</text>
  <text x="232" y="780" text-anchor="middle">成功与拒付保留各自真实结果</text>
  <rect x="511" y="722" width="409" height="79" rx="9" fill="#fff3dc" stroke="#e3c88f"/>
  <text x="715" y="753" text-anchor="middle" class="head">保留许可，任务进入 needs_confirmation</text>
  <text x="715" y="780" text-anchor="middle">再次核验仍查询原键，不自动解锁重发</text>
</svg>
