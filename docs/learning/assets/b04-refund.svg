<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="1131" viewBox="0 0 1120 1131" role="img" aria-labelledby="title desc"><title id="title">仅退款的端到端时序</title><desc id="desc">从上到下读　箭头标明交接方向　各步骤时间长度不按比例</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L7 4L0 8" fill="#52758a"/></marker><style>text{font-family:'Microsoft YaHei','Noto Sans SC',sans-serif;fill:#253b49}.title{font-size:25px;font-weight:700}.subtitle{font-size:16px;fill:#607581}.head{font-size:19px;font-weight:700}.body{font-size:16px}.label{font-size:14px;fill:#405e70}.group{font-size:16px;font-weight:700;fill:#4c6b7d}</style></defs><rect width="1120" height="1131" fill="#f8fafb" rx="16"/>
<text x="560" y="43" text-anchor="middle" class="title"><tspan x="560" dy="0">仅退款的端到端时序</tspan></text>
<text x="560" y="74" text-anchor="middle" class="subtitle"><tspan x="560" dy="0">从上到下读　箭头标明交接方向　各步骤时间长度不按比例</tspan></text>
<rect x="25" y="105" width="245" height="961" rx="14" fill="#f3f6f8" stroke="#cfdae1"/>
<text x="147.5" y="132" text-anchor="middle" class="group"><tspan x="147.5" dy="0">客户与页面</tspan></text>
<rect x="300" y="105" width="245" height="961" rx="14" fill="#f0f4f7" stroke="#cfdae1"/>
<text x="422.5" y="132" text-anchor="middle" class="group"><tspan x="422.5" dy="0">会话与业务受理</tspan></text>
<rect x="575" y="105" width="245" height="961" rx="14" fill="#f3f6f8" stroke="#cfdae1"/>
<text x="697.5" y="132" text-anchor="middle" class="group"><tspan x="697.5" dy="0">后台与领域记录</tspan></text>
<rect x="850" y="105" width="245" height="961" rx="14" fill="#f0f4f7" stroke="#cfdae1"/>
<text x="972.5" y="132" text-anchor="middle" class="group"><tspan x="972.5" dy="0">主管或操作员</tspan></text>
<path d="M147.5 235V260H422.5" fill="none" stroke="#52758a" stroke-width="1.8"  marker-end="url(#arrow)"/>
<rect x="264" y="238" width="42" height="23" rx="4" fill="#f8fafb"/>
<text x="285" y="254" text-anchor="middle" class="label"><tspan x="285" dy="0">输入</tspan></text>
<path d="M422.5 368V393H147.5" fill="none" stroke="#52758a" stroke-width="1.8"  marker-end="url(#arrow)"/>
<rect x="250" y="371" width="70" height="23" rx="4" fill="#f8fafb"/>
<text x="285" y="387" text-anchor="middle" class="label"><tspan x="285" dy="0">受理结果</tspan></text>
<path d="M422.5 501V526H147.5" fill="none" stroke="#52758a" stroke-width="1.8"  marker-end="url(#arrow)"/>
<rect x="250" y="504" width="70" height="23" rx="4" fill="#f8fafb"/>
<text x="285" y="520" text-anchor="middle" class="label"><tspan x="285" dy="0">必要信息</tspan></text>
<path d="M422.5 393V421" fill="none" stroke="#52758a" stroke-width="1.8"  marker-end="url(#arrow)"/>
<path d="M422.5 634V659H697.5" fill="none" stroke="#52758a" stroke-width="1.8"  marker-end="url(#arrow)"/>
<rect x="525" y="637" width="70" height="23" rx="4" fill="#f8fafb"/>
<text x="560" y="653" text-anchor="middle" class="label"><tspan x="560" dy="0">业务交接</tspan></text>
<path d="M422.5 526V554" fill="none" stroke="#52758a" stroke-width="1.8"  marker-end="url(#arrow)"/>
<path d="M697.5 900V925H147.5" fill="none" stroke="#52758a" stroke-width="1.8"  marker-end="url(#arrow)"/>
<rect x="345.5" y="903" width="154" height="23" rx="4" fill="#f8fafb"/>
<text x="422.5" y="919" text-anchor="middle" class="label"><tspan x="422.5" dy="0">原工具结果与客户事件</tspan></text>
<path d="M697.5 767V820" fill="none" stroke="#52758a" stroke-width="1.8"  marker-end="url(#arrow)"/>
<path d="M697.5 1033V1058H972.5" fill="none" stroke="#52758a" stroke-width="1.8"  marker-end="url(#arrow)"/>
<rect x="793" y="1036" width="84" height="23" rx="4" fill="#f8fafb"/>
<text x="835" y="1052" text-anchor="middle" class="label"><tspan x="835" dy="0">核验原业务</tspan></text>
<path d="M810 727H835V993H810" fill="none" stroke="#52758a" stroke-width="1.8"  marker-end="url(#arrow)"/>
<rect x="858" y="744" width="84" height="23" rx="4" fill="#f8fafb"/>
<text x="900" y="760" text-anchor="middle" class="label"><tspan x="900" dy="0">响应不明确</tspan></text>
<rect x="35" y="155" width="225" height="80" rx="10" fill="#e8eff5" stroke="#b8cbd7"/>
<text x="147.5" y="188.5" text-anchor="middle" class="head"><tspan x="147.5" dy="0">提交诉求</tspan></text>
<text x="147.5" y="218.5" text-anchor="middle" class="body"><tspan x="147.5" dy="0">原请求键与客户身份</tspan></text>
<rect x="310" y="288" width="225" height="80" rx="10" fill="#e8eff5" stroke="#b8cbd7"/>
<text x="422.5" y="321.5" text-anchor="middle" class="head"><tspan x="422.5" dy="0">命令与任务已保存</tspan></text>
<text x="422.5" y="351.5" text-anchor="middle" class="body"><tspan x="422.5" dy="0">202 返回原运行身份</tspan></text>
<rect x="310" y="421" width="225" height="80" rx="10" fill="#e8eff5" stroke="#b8cbd7"/>
<text x="422.5" y="454.5" text-anchor="middle" class="head"><tspan x="422.5" dy="0">查证与补问</tspan></text>
<text x="422.5" y="484.5" text-anchor="middle" class="body"><tspan x="422.5" dy="0">确认订单与原因</tspan></text>
<rect x="310" y="554" width="225" height="80" rx="10" fill="#e8eff5" stroke="#b8cbd7"/>
<text x="422.5" y="587.5" text-anchor="middle" class="head"><tspan x="422.5" dy="0">重查并准备原方案</tspan></text>
<text x="422.5" y="617.5" text-anchor="middle" class="body"><tspan x="422.5" dy="0">事务保存售后 退款 授权</tspan></text>
<rect x="585" y="687" width="225" height="80" rx="10" fill="#e8eff5" stroke="#b8cbd7"/>
<text x="697.5" y="720.5" text-anchor="middle" class="head"><tspan x="697.5" dy="0">执行原退款</tspan></text>
<text x="697.5" y="750.5" text-anchor="middle" class="body"><tspan x="697.5" dy="0">取得许可 调用模拟渠道</tspan></text>
<rect x="585" y="820" width="225" height="80" rx="10" fill="#e5f1e9" stroke="#b8cbd7"/>
<text x="697.5" y="853.5" text-anchor="middle" class="head"><tspan x="697.5" dy="0">明确结果与投影</tspan></text>
<text x="697.5" y="883.5" text-anchor="middle" class="body"><tspan x="697.5" dy="0">核验完整成功后反馈</tspan></text>
<rect x="585" y="953" width="225" height="80" rx="10" fill="#fff1d6" stroke="#b8cbd7"/>
<text x="697.5" y="986.5" text-anchor="middle" class="head"><tspan x="697.5" dy="0">若结果未知</tspan></text>
<text x="697.5" y="1016.5" text-anchor="middle" class="body"><tspan x="697.5" dy="0">保留原许可 不重发</tspan></text>
<text x="560" y="1108" text-anchor="middle" class="label"><tspan x="560" dy="0">202 不等于退款成功　未知分支不返回建单步骤</tspan></text>
</svg>
